    const avgScore = total > 0 ? (experts.reduce((sum, e) => sum + e.score, 0) / total).toFixed(1) : '0.0';
    return { total, active, totalMeetings, avgScore };
}

        return matchSearch && matchFilter;
    });
}

    return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-50 text-red-500">取消</span>';
}

function renderStars(score) {
    const full = Math.floor(score);
    const hasHalf = score - full >= 0.5;
    let html = '';
    for (let i = 0; i < full; i++) html += '<i class="ri-star-fill text-yellow-400 text-xs"></i>';
    if (hasHalf) html += '<i class="ri-star-half-fill text-yellow-400 text-xs"></i>';
    for (let i = full + (hasHalf ? 1 : 0); i < 5; i++) html += '<i class="ri-star-line text-gray-300 text-xs"></i>';
    return html;
}

                                            <p class="text-xs text-gray-400">${e.title}</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-sm text-gray-600">${e.institution}</td>
                                <td class="px-6 py-4">
                                    <div class="flex flex-wrap gap-1.5">
                                        ${e.specialties.map(s => `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs bg-gray-100 text-gray-600">${s}</span>`).join('')}
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3">
                                        <div class="progress-bar w-20 flex-shrink-0">
                                            <div class="progress-fill ${getAccuracyColor(e.accuracy)}" style="width: ${e.accuracy}%"></div>
                                        </div>
                                        <span class="text-sm font-medium ${getAccuracyTextColor(e.accuracy)}">${e.accuracy}%</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-1.5">
                                        ${renderStars(e.score)}
                                        <span class="text-sm font-medium text-gray-700 ml-1">${e.score}</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-sm text-gray-600">${e.meetings}场</td>
                                <td class="px-6 py-4">${getStatusBadge(e.status)}</td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-2 text-sm">
                                        <button onclick="openDetailModal('${e.id}')" class="text-gray-500 hover:text-red-500 transition-colors">详情</button>
                                        <span class="text-gray-200">|</span>
                                        <button onclick="openEditModal('${e.id}')" class="text-gray-500 hover:text-red-500 transition-colors">编辑</button>
                                        <span class="text-gray-200">|</span>
                                        <button onclick="toggleStatus('${e.id}')" class="${e.status === '启用' ? 'text-red-500 hover:text-red-600' : 'text-green-500 hover:text-green-600'} transition-colors">${e.status === '启用' ? '取消' : '启用'}</button>
                                        <span class="text-gray-200">|</span>
                                        <button onclick="openDeleteModal('${e.id}')" class="text-red-400 hover:text-red-600 transition-colors">删除</button>
                                    </div>
                                </td>
                            </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    ${filtered.length === 0 ? '<div class="py-16 text-center text-gray-400 text-sm">暂无数据</div>' : ''}
                </div>
            </main>
        </div>
    </div>`;
}

// ============ 交互 ============
function handleSearch(val) { searchQuery = val.trim(); render(); }
function setFilter(f) { activeFilter = f; render(); }

function toggleStatus(id) {
    const e = experts.find(x => x.id === id);
    if (e) {
        e.status = e.status === '启用' ? '取消' : '启用';
        render();
    }
}

            <button onclick="saveExpert()" class="h-10 px-5 rounded-lg bg-red-500 text-white hover:bg-red-600 transition-colors text-sm">保存</button>
        </div>
    `;
    const modal = document.getElementById('editModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}
function openAddModal() { openEditModal(null); }
function closeEditModal() {
    const modal = document.getElementById('editModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    editingExpertId = null;
    editCardData = null;
    editAvatarData = null;
    editAgreementData = null;
}

// ============ 文件上传处理 ============
function handleCardUpload(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('名片文件不能超过 5MB'); input.value = ''; return; }
    const reader = new FileReader();
    reader.onload = function(e) {
        editCardData = e.target.result;
        document.getElementById('cardUploadPlaceholder').classList.add('hidden');
        const preview = document.getElementById('cardUploadPreview');
        preview.classList.remove('hidden');
        preview.innerHTML = '<div class="flex items-center justify-center gap-2 text-sm text-green-600"><i class="ri-checkbox-circle-line"></i>' + file.name + '</div><p class="text-xs text-gray-400 mt-1">点击重新上传</p>';
    };
    reader.readAsDataURL(file);
}

function handleAvatarUpload(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('头像文件不能超过 5MB'); input.value = ''; return; }
    const reader = new FileReader();
    reader.onload = function(e) {
        editAvatarData = e.target.result;
        document.getElementById('avatarUploadPlaceholder').classList.add('hidden');
        const preview = document.getElementById('avatarUploadPreview');
        preview.classList.remove('hidden');
        preview.innerHTML = '<img src="' + editAvatarData + '" class="w-14 h-14 rounded-full mx-auto object-cover border-2 border-green-400"><p class="text-xs text-gray-400 mt-1">点击重新上传</p>';
    };
    reader.readAsDataURL(file);
}

function handleAgreementUpload(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { alert('合作协议文件不能超过 10MB'); input.value = ''; return; }
    const reader = new FileReader();
    reader.onload = function(e) {
        editAgreementData = e.target.result;
        document.getElementById('agreementUploadPlaceholder').classList.add('hidden');
        const preview = document.getElementById('agreementUploadPreview');
        preview.classList.remove('hidden');
        preview.innerHTML = '<div class="flex items-center justify-center gap-2 text-sm text-green-600"><i class="ri-checkbox-circle-line"></i>' + file.name + '</div><p class="text-xs text-gray-400 mt-1">点击重新上传</p>';
    };
    reader.readAsDataURL(file);
}

function saveExpert() {
    const name = document.getElementById('editName').value.trim();
    const title = document.getElementById('editTitle').value.trim();
    const institution = document.getElementById('editInstitution').value.trim();
    const city = document.getElementById('editCity').value.trim();
    const years = parseInt(document.getElementById('editYears').value) || 0;
    const bio = document.getElementById('editBio').value.trim();
    const phone = document.getElementById('editPhone').value.trim();
    const email = document.getElementById('editEmail').value.trim();
    const wechat = document.getElementById('editWechat').value.trim();
    const level = document.getElementById('editLevel').value;
    const onlinePrice = parseFloat(document.getElementById('editOnlinePrice').value) || 0;
    const onlineUnit = document.getElementById('editOnlineUnit').value;
    const offlinePrice = parseFloat(document.getElementById('editOfflinePrice').value) || 0;
    const offlineUnit = document.getElementById('editOfflineUnit').value;
    const specialties = document.getElementById('editSpecialties').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    const accuracy = 80;
    const score = parseFloat(document.getElementById('editScore').value) || 0;
    const meetings = parseInt(document.getElementById('editMeetings').value) || 0;
    const status = document.querySelector('input[name="editStatus"]:checked')?.value || '启用';

    if (!name || !institution) {
        alert('请填写姓名和所属机构');
        return;
    }

    if (editingExpertId) {
        const idx = experts.findIndex(e => e.id === editingExpertId);
        if (idx > -1) {
            experts[idx] = { ...experts[idx], name, title, institution, city, years, bio, phone, email, wechat, level, onlinePrice, onlineUnit, offlinePrice, offlineUnit, specialties, accuracy, score, meetings, status,
                cardData: editCardData || experts[idx].cardData,
                avatar: editAvatarData || experts[idx].avatar,
                agreementData: editAgreementData || experts[idx].agreementData };
        }
    } else {
        const newId = 'e' + (Date.now() % 100000);
        experts.push({ id: newId, name, title, institution, city, years, bio, phone, email, wechat, level, onlinePrice, onlineUnit, offlinePrice, offlineUnit, specialties, accuracy, score, meetings, status,
            cardData: editCardData, avatar: editAvatarData || `https://api.dicebear.com/7.x/avataaars/svg?seed=${newId}`, agreementData: editAgreementData });
    }
    closeEditModal();
    render();
}

// ============ 删除弹窗 ============
function openDeleteModal(id) {
    deletingExpertId = id;
    const e = experts.find(x => x.id === id);
    document.getElementById('deleteExpertName').textContent = e ? `确定要删除专家「${e.name}」吗？此操作不可恢复。` : '确定要删除该专家吗？此操作不可恢复。';
    const modal = document.getElementById('deleteModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
}
function closeDeleteModal() {
    const modal = document.getElementById('deleteModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    deletingExpertId = null;
}
function confirmDelete() {
    const idx = experts.findIndex(e => e.id === deletingExpertId);
    if (idx > -1) {
        experts.splice(idx, 1);
    }
    closeDeleteModal();
    render();
}

// ============ 点击弹窗外部关闭 ============
document.getElementById('detailModal').addEventListener('click', function(e) { if (e.target === this) closeDetailModal(); });
document.getElementById('editModal').addEventListener('click', function(e) { if (e.target === this) closeEditModal(); });
document.getElementById('deleteModal').addEventListener('click', function(e) { if (e.target === this) closeDeleteModal(); });

// ============ 初始渲染 ============
render();
</script>
</body>
</html>
