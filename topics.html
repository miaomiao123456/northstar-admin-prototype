<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北极星管理平台 - 话题与板块&产业链</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        .filter-btn.active { background: white; color: #1f2937; font-weight: 500; }
        .modal-backdrop { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(2px); }
        .tab-btn.active { border-color: #ef4444; color: #ef4444; font-weight: 500; }
        .heat-bar { height: 8px; border-radius: 4px; background: linear-gradient(90deg, #ef4444 0%, #f97316 100%); transition: width 0.5s ease; }
        * { white-space: nowrap; }
        i { flex-shrink: 0 !important; }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div id="app"></div>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between p-5 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-900" id="detailModalTitle">板块详情</h3>
                <button onclick="closeModal('detailModal')" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-colors cursor-pointer"><i class="ri-close-line text-xl"></i></button>
            </div>
            <div id="detailModalBody" class="p-5"></div>
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div id="editModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between p-5 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-900">编辑板块/产业链</h3>
                <button onclick="closeModal('editModal')" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-colors cursor-pointer"><i class="ri-close-line text-xl"></i></button>
            </div>
            <div id="editModalBody" class="p-5"></div>
        </div>
    </div>

<script>
let activeTab = '行业板块';
let activeCategory = '全部';
let searchQuery = '';

const industries = [
    { id: 'ind1', name: '医药生物', code: 'SW801150', category: '医药', heat: 92, minutes: 12, desc: '涵盖化学制药、生物制品、医疗器械、医疗服务等细分领域，是A股市场重要的成长赛道。' },
    { id: 'ind2', name: '电子', code: 'SW801080', category: '科技', heat: 96, minutes: 18, desc: '包含半导体、消费电子、电子元器件等细分领域，受益于国产替代和AI算力需求爆发。' },
    { id: 'ind3', name: '新能源', code: 'SW801200', category: '新能源', heat: 88, minutes: 15, desc: '涵盖光伏、风电、储能、新能源汽车等细分领域，是政策重点支持的战略性新兴产业。' },
    { id: 'ind4', name: '银行', code: 'SW801780', category: '金融', heat: 72, minutes: 8, desc: '包括国有大行、股份制银行、城商行等，受益于利率企稳和资产质量改善。' },
    { id: 'ind5', name: '食品饮料', code: 'SW801120', category: '消费', heat: 85, minutes: 10, desc: '涵盖白酒、啤酒、乳制品、调味品等消费品，品牌护城河深厚。' },
    { id: 'ind6', name: '计算机', code: 'SW801750', category: '科技', heat: 91, minutes: 14, desc: '包含云计算、人工智能、网络安全、信创等方向，是数字经济核心赛道。' },
];

const chains = [
    { id: 'ch1', name: 'AI算力产业链', category: '科技', heat: 98, minutes: 22, desc: '从上游芯片（GPU/AI芯片）到中游服务器/光模块，再到下游大模型应用，全面覆盖AI算力产业链。' },
    { id: 'ch2', name: '新能源汽车产业链', category: '新能源', heat: 94, minutes: 19, desc: '上游锂矿/正负极材料，中游电池/电驱系统，下游整车及充电桩，产业链条完整清晰。' },
    { id: 'ch3', name: '创新药产业链', category: '医药', heat: 87, minutes: 11, desc: '从CXO外包到创新药研发、临床试验、商业化，覆盖创新药全生命周期。' },
    { id: 'ch4', name: '半导体国产替代链', category: '科技', heat: 93, minutes: 16, desc: '从设备/材料到晶圆代工/封测，再到芯片设计，半导体国产替代加速推进。' },
];

const categories = ['全部','医药','科技','新能源','金融','消费'];

const navLinkMap = {
    '/experts': 'experts-clone.html', '/conferences': 'conferences.html', '/attendees': 'attendees.html',
    '/minutes': 'minutes.html', '/collections': 'collections.html', '/topics': 'topics.html', '/stocks': 'stocks.html',
    '/research': 'research.html', '/users': 'user-management.html', '/source-monitor': 'source-monitor.html', '/user-profile': 'user-profile.html'
};

function renderNavItem(path, icon, label, isSub, isActive) {
    const href = navLinkMap[path] || path.replace('/', '') + '.html';
    if (isSub) {
        return `<a class="flex items-center h-10 mx-2 mb-0.5 rounded-lg text-sm transition-colors cursor-pointer whitespace-nowrap pl-8 pr-4 ${isActive ? 'bg-red-50 text-red-600 font-medium' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-800'}" href="${href}"><div class="w-3 h-3 flex items-center justify-center mr-1 flex-shrink-0"><i class="ri-corner-down-right-line text-xs text-gray-300"></i></div><div class="w-5 h-5 flex items-center justify-center flex-shrink-0"><i class="${icon} text-base"></i></div><span class="ml-2">${label}</span></a>`;
    }
    return `<a class="flex items-center h-10 mx-2 mb-0.5 rounded-lg text-sm transition-colors cursor-pointer whitespace-nowrap px-4 ${isActive ? 'bg-red-50 text-red-600 font-medium' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-800'}" href="${href}"><div class="w-5 h-5 flex items-center justify-center flex-shrink-0"><i class="${icon} text-base"></i></div><span class="ml-2">${label}</span></a>`;
}

function renderNav() {
    return `<aside class="flex flex-col bg-white border-r border-gray-100 transition-all duration-300 w-56">
        <div class="flex items-center h-16 px-4 border-b border-gray-100 cursor-pointer select-none"><img alt="财跃星辰" class="w-8 h-8 object-contain flex-shrink-0" src="https://static.readdy.ai/image/3dd3b08e3f41e718a9a692da40c4373e/36a1cddcc28d86e13fb969a9b2232329.png"><span class="ml-2 text-sm font-semibold text-gray-800 whitespace-nowrap">北极星管理平台</span></div>
        <nav class="flex-1 py-4 overflow-y-auto">
            ${renderNavItem('/experts','ri-user-star-line','专家管理',false,false)}
            ${renderNavItem('/conferences','ri-video-chat-line','专家会议管理',false,false)}
            ${renderNavItem('/attendees','ri-team-line','会议人员管理',true,false)}
            ${renderNavItem('/minutes','ri-file-text-line','专家纪要库',false,false)}
            ${renderNavItem('/collections','ri-bookmark-3-line','精选纪要集',true,false)}
            ${renderNavItem('/topics','ri-pie-chart-line','话题与板块&产业链',true,true)}
            ${renderNavItem('/stocks','ri-stock-line','话题与股票清单',true,false)}
            ${renderNavItem('/research','ri-survey-line','调研活动管理',false,false)}
            ${renderNavItem('/users','ri-group-line','用户审核管理',false,false)}
            ${renderNavItem('/user-profile','ri-user-heart-line','用户画像管理',false,false)}
            ${renderNavItem('/source-monitor','ri-radar-line','信源监控需求管理',false,false)}
        </nav>
        <div class="border-t border-gray-100 p-3"><button class="w-full flex items-center justify-center h-9 rounded-lg text-gray-400 hover:bg-gray-50 hover:text-gray-600 transition-colors cursor-pointer"><div class="w-5 h-5 flex items-center justify-center"><i class="ri-arrow-left-s-line text-lg"></i></div></button></div>
    </aside>`;
}

function getStats() {
    return {
        industries: industries.length,
        chains: chains.length,
        industryMinutes: industries.reduce((s,i) => s + i.minutes, 0),
        chainMinutes: chains.reduce((s,c) => s + c.minutes, 0),
    };
}

function getFiltered() {
    const data = activeTab === '行业板块' ? industries : chains;
    return data.filter(item => {
        const matchSearch = !searchQuery || item.name.includes(searchQuery) || (item.desc||'').includes(searchQuery);
        const matchCat = activeCategory === '全部' || item.category === activeCategory;
        return matchSearch && matchCat;
    });
}

function render() {
    const stats = getStats();
    const filtered = getFiltered();
    const tabs = ['行业板块','产业链'];

    document.getElementById('app').innerHTML = `
    <div class="flex h-screen bg-gray-50 font-sans overflow-hidden">
        ${renderNav()}
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
                <h1 class="text-base font-semibold text-gray-800">话题与板块&产业链</h1>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 flex items-center justify-center"><i class="ri-notification-3-line text-gray-400 text-lg"></i></div>
                    <div class="flex items-center gap-2 cursor-pointer"><div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center"><span class="text-xs font-medium text-red-600">管</span></div><span class="text-sm text-gray-600">管理员</span><div class="w-4 h-4 flex items-center justify-center"><i class="ri-arrow-down-s-line text-gray-400"></i></div></div>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto p-6">
                <!-- 看板 -->
                <div class="grid grid-cols-4 gap-4 mb-6">
                    <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                        <div class="w-11 h-11 rounded-lg flex items-center justify-center text-red-500 bg-red-50"><i class="ri-apps-line text-xl"></i></div>
                        <div><div class="text-2xl font-semibold text-gray-800">${stats.industries}</div><div class="text-xs text-gray-400 mt-0.5">行业板块</div></div>
                    </div>
                    <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                        <div class="w-11 h-11 rounded-lg flex items-center justify-center text-blue-500 bg-blue-50"><i class="ri-node-tree text-xl"></i></div>
                        <div><div class="text-2xl font-semibold text-gray-800">${stats.chains}</div><div class="text-xs text-gray-400 mt-0.5">产业链</div></div>
                    </div>
                    <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                        <div class="w-11 h-11 rounded-lg flex items-center justify-center text-orange-500 bg-orange-50"><i class="ri-file-list-3-line text-xl"></i></div>
                        <div><div class="text-2xl font-semibold text-gray-800">${stats.industryMinutes}</div><div class="text-xs text-gray-400 mt-0.5">板块关联纪要</div></div>
                    </div>
                    <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                        <div class="w-11 h-11 rounded-lg flex items-center justify-center text-green-500 bg-green-50"><i class="ri-links-line text-xl"></i></div>
                        <div><div class="text-2xl font-semibold text-gray-800">${stats.chainMinutes}</div><div class="text-xs text-gray-400 mt-0.5">产业链关联纪要</div></div>
                    </div>
                </div>

                <!-- Tab & 筛选 -->
                <div class="bg-white rounded-xl">
                    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-50">
                        <div class="flex items-center gap-4">
                            <!-- Tab -->
                            <div class="flex items-center gap-1 border-b border-gray-100 -mb-[17px] pb-3">
                                ${tabs.map(t => `<button class="tab-btn px-4 py-1.5 text-sm border-b-2 transition-colors cursor-pointer ${activeTab===t?'active border-red-500 text-red-500 font-medium':'border-transparent text-gray-500 hover:text-gray-700'}" onclick="activeTab='${t}';activeCategory='全部';render()">${t}</button>`).join('')}
                            </div>
                            <!-- 分类筛选 -->
                            <div class="flex items-center gap-1 bg-gray-50 rounded-lg p-1">
                                ${categories.map(c => `<button class="filter-btn px-3 py-1 rounded-md text-sm transition-colors cursor-pointer whitespace-nowrap ${activeCategory===c?'active bg-white text-gray-800 font-medium':'text-gray-500 hover:text-gray-700'}" onclick="activeCategory='${c}';render()">${c}</button>`).join('')}
                            </div>
                            <!-- 搜索 -->
                            <div class="relative">
                                <div class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 flex items-center justify-center text-gray-400"><i class="ri-search-line text-sm"></i></div>
                                <input placeholder="搜索板块/产业链..." class="pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg w-48 focus:outline-none focus:border-red-400" value="${searchQuery}" oninput="searchQuery=this.value;render()">
                            </div>
                        </div>
                    </div>

                    <!-- 卡片网格 -->
                    <div class="p-5 grid grid-cols-2 gap-4">
                        ${filtered.map(item => `
                        <div class="border border-gray-100 rounded-xl p-5 hover:shadow-md hover:border-red-100 transition-all cursor-pointer" onclick="openDetailModal('${item.id}')">
                            <div class="flex items-start justify-between mb-3">
                                <div>
                                    <h3 class="text-gray-800 font-semibold mb-0.5">${item.name}</h3>
                                    ${item.code ? `<span class="text-xs text-gray-400">${item.code}</span>` : ''}
                                </div>
                                <span class="px-2 py-0.5 rounded-md bg-gray-50 text-gray-500 text-xs">${item.category}</span>
                            </div>
                            <p class="text-gray-400 text-sm mb-4 line-clamp-2">${item.desc || ''}</p>
                            <div class="flex items-center justify-between">
                                <div class="flex-1 mr-4">
                                    <div class="text-xs text-gray-400 mb-1">热度指数</div>
                                    <div class="w-full bg-gray-100 rounded-full h-2">
                                        <div class="heat-bar" style="width:${item.heat}%"></div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-lg font-semibold text-gray-800">${item.heat}</div>
                                    <div class="text-xs text-gray-400">热度</div>
                                </div>
                            </div>
                            <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-50">
                                <span class="text-sm text-gray-500"><i class="ri-file-text-line mr-1"></i>${item.minutes} 篇纪要</span>
                                <button onclick="event.stopPropagation();openEditModal('${item.id}')" class="text-xs text-gray-400 hover:text-red-500 cursor-pointer">编辑</button>
                            </div>
                        </div>`).join('')}
                    </div>
                    ${filtered.length === 0 ? '<div class="py-16 text-center text-gray-400"><i class="ri-inbox-line text-4xl mb-2 block"></i>暂无数据</div>' : ''}
                </div>
            </main>
        </div>
    </div>`;
}

function openDetailModal(id) {
    const item = [...industries,...chains].find(x => x.id === id);
    if (!item) return;
    const isIndustry = industries.includes(item);
    document.getElementById('detailModalTitle').textContent = isIndustry ? '板块详情' : '产业链详情';
    document.getElementById('detailModalBody').innerHTML = `
        <div class="space-y-4">
            <div>
                <h3 class="text-lg font-semibold text-gray-900">${item.name}</h3>
                ${item.code ? `<span class="text-sm text-gray-400">${item.code}</span>` : ''}
            </div>
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-gray-50 rounded-lg p-3 text-center"><div class="text-xl font-semibold text-gray-800">${item.heat}</div><div class="text-xs text-gray-400">热度指数</div></div>
                <div class="bg-gray-50 rounded-lg p-3 text-center"><div class="text-xl font-semibold text-gray-800">${item.minutes}</div><div class="text-xs text-gray-400">关联纪要</div></div>
                <div class="bg-gray-50 rounded-lg p-3 text-center"><div class="text-xl font-semibold text-gray-800">${item.category}</div><div class="text-xs text-gray-400">分类</div></div>
            </div>
            <div><div class="text-xs text-gray-400 mb-1">描述</div><div class="text-gray-600 text-sm">${item.desc || '暂无描述'}</div></div>
        </div>`;
    showModal('detailModal');
}

function openEditModal(id) {
    const item = [...industries,...chains].find(x => x.id === id);
    if (!item) return;
    document.getElementById('editModalBody').innerHTML = `
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">名称</label>
                <input id="editName" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400" value="${item.name}">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">分类</label>
                <select id="editCat" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400">
                    ${categories.filter(c=>c!=='全部').map(c => `<option ${item.category===c?'selected':''}>${c}</option>`).join('')}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                <textarea id="editDesc" rows="3" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400 resize-none">${item.desc||''}</textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="closeModal('editModal')" class="flex-1 h-10 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors text-sm cursor-pointer">取消</button>
                <button onclick="saveEdit('${id}')" class="flex-1 h-10 rounded-lg bg-red-500 text-white hover:bg-red-600 transition-colors text-sm cursor-pointer">保存</button>
            </div>
        </div>`;
    showModal('editModal');
}

function saveEdit(id) {
    const item = [...industries,...chains].find(x => x.id === id);
    if (!item) return;
    item.name = document.getElementById('editName').value.trim() || item.name;
    item.category = document.getElementById('editCat').value;
    item.desc = document.getElementById('editDesc').value.trim();
    closeModal('editModal');
    render();
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
function showModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }

render();
</script>
</body>
</html>
