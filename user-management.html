    // ============ 统计数据 ============
    function getStats() {
        const total = users.length;
        const pending = users.filter(u => u.reviewStatus === 'pending').length;
        const approved = users.filter(u => u.reviewStatus === 'approved').length;
        const rejected = users.filter(u => u.reviewStatus === 'rejected').length;
        return { total, pending, approved, rejected };
    }

    // ============ 过滤 & 搜索 ============
    function getFilteredUsers() {
        return users.filter(u => {
            const matchFilter = currentFilter === 'all' || u.reviewStatus === currentFilter;
            const matchSearch = searchKeyword === '' ||
                u.name.includes(searchKeyword) ||
                u.company.includes(searchKeyword) ||
                u.email.includes(searchKeyword) ||
                u.phone.includes(searchKeyword);
            return matchFilter && matchSearch;
        });
    }

    // ============ 渲染状态标签 ============
    function renderStatusTag(status) {
        const map = {
            pending: { label: '待审核', cls: 'bg-orange-50 text-orange-600' },
            approved: { label: '审核通过', cls: 'bg-green-50 text-green-600' },
            rejected: { label: '审核不通过', cls: 'bg-red-50 text-red-600' },
        };
        const s = map[status] || map.pending;
        return '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ' + s.cls + '">' + s.label + '</span>';
    }

    // ============ 渲染用户头像占位 ============
    function renderAvatar(name) {
        const colors = ['bg-red-100 text-red-600', 'bg-blue-100 text-blue-600', 'bg-green-100 text-green-600', 'bg-purple-100 text-purple-600', 'bg-amber-100 text-amber-600', 'bg-pink-100 text-pink-600'];
        const idx = name.charCodeAt(0) % colors.length;
        const cls = colors[idx];
        const initial = name.charAt(name.length - 2) + name.charAt(name.length - 1);
        return '<div class="w-9 h-9 rounded-full ' + cls + ' flex items-center justify-center flex-shrink-0 text-xs font-medium">' + initial + '</div>';
    }

    // ============ 渲染名片 SVG ============

        const seed = user.cardSeed || user.id;
        const colors = [
            { bg1: '#1a1a2e', bg2: '#16213e', accent: '#e94560' },
            { bg1: '#0f3460', bg2: '#16213e', accent: '#f0a500' },
            { bg1: '#1b1b3a', bg2: '#2d2d5e', accent: '#48c9b0' },
            { bg1: '#2c3e50', bg2: '#34495e', accent: '#e74c3c' },
            { bg1: '#1a3c40', bg2: '#1f4037', accent: '#f39c12' },
            { bg1: '#2d132c', bg2: '#3a1c3f', accent: '#ee4540' },
        ];
        const ci = Math.abs(seed.charCodeAt(0) % colors.length);
        const c = colors[ci];
        const name = user.name || '';
        const company = user.company || '';
        const position = user.position || '';
        const phone = user.phone || '';

    function closeReviewModal() {
        const modal = document.getElementById('reviewModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        reviewingUserId = null;

    function submitReview() {
        const result = document.querySelector('input[name="reviewResult"]:checked');
        if (!result) {
            const radios = document.querySelector('input[name="reviewResult"]');
            radios.closest('div').classList.add('ring-2', 'ring-red-300', 'rounded-lg');
            setTimeout(() => radios.closest('div').classList.remove('ring-2', 'ring-red-300', 'rounded-lg'), 1500);
            return;
        }

        const user = users.find(u => u.id === reviewingUserId);
        if (user) {
            user.reviewStatus = result.value;
        }

        closeReviewModal();
        render();
    }

    // ============ 新增/编辑用户弹窗 ============
    let selectedUserType = '';

    function openEditUserModal(userId) {
        editingUserId = userId;
        openUserModal(userId);
    }

    function openAddUserModal() {
        editingUserId = null;
        openUserModal(null);
    }

    function openUserModal(userId) {
        const user = userId ? users.find(u => u.id === userId) : null;
        const isEdit = !!user;

        // 设置标题和按钮文字
        const modal = document.getElementById('addUserModal');
        modal.querySelector('h3').textContent = isEdit ? '编辑用户' : '新增用户';
        modal.querySelector('button[onclick*="submit"]').textContent = isEdit ? '保存修改' : '确认新增';

        // 清空或填充表单
        document.getElementById('addUserName').value = user ? user.name : '';
        document.getElementById('addUserCompany').value = user ? user.company : '';
        document.getElementById('addUserPosition').value = user ? user.position : '';
        document.getElementById('addUserPhone').value = user ? user.phone : '';
        document.getElementById('addUserEmail').value = user ? user.email : '';
        document.getElementById('addUserCity').value = user ? user.city || '' : '';
        document.getElementById('addUserYears').value = user ? user.years || '' : '';
        document.getElementById('addUserSpecialties').value = user ? user.specialties || '' : '';
        document.getElementById('addUserBio').value = user ? user.bio || '' : '';

        // 重置性别
        const genderRadios = document.querySelectorAll('input[name="addUserGender"]');
        genderRadios.forEach(r => r.checked = false);
        if (user && user.gender) {
            genderRadios.forEach(r => { if (r.value === user.gender) r.checked = true; });
        }

        // 设置用户类型
        selectUserType(user ? user.userType || '' : '');
        selectMemberType(user ? user.memberType || '' : '');

        // 重置/恢复名片上传
        addUserCardData = user ? user.cardData : null;
        if (user && user.cardData) {
            document.getElementById('cardUploadPlaceholder2').classList.add('hidden');
            document.getElementById('cardUploadPreview2').classList.remove('hidden');
            document.getElementById('cardPreviewImg').src = user.cardData;
        } else {
            addUserCardData = null;
            document.getElementById('cardUploadPlaceholder2').classList.remove('hidden');
            document.getElementById('cardUploadPreview2').classList.add('hidden');
        }
        document.getElementById('cardFileInput').value = '';

        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

        selectedUserType = type;
        const buyerLabel = document.getElementById('userTypeBuyerLabel');
        const sellerLabel = document.getElementById('userTypeSellerLabel');
        [buyerLabel, sellerLabel].forEach(l => { l.classList.remove('border-red-400', 'bg-red-50'); l.querySelector('span').classList.remove('text-red-600', 'font-medium'); });
        if (type === '买方') { buyerLabel.classList.add('border-red-400', 'bg-red-50'); buyerLabel.querySelector('span').classList.add('text-red-600', 'font-medium'); }
        else if (type === '卖方') { sellerLabel.classList.add('border-red-400', 'bg-red-50'); sellerLabel.querySelector('span').classList.add('text-red-600', 'font-medium'); }
    }

    function selectMemberType(type) {
        const yesLabel = document.getElementById('memberYesLabel');
        const noLabel = document.getElementById('memberNoLabel');
        [yesLabel, noLabel].forEach(l => { l.classList.remove('border-red-400', 'bg-red-50'); l.querySelector('span').classList.remove('text-red-600', 'font-medium'); });
        if (type === '会员') { yesLabel.classList.add('border-red-400', 'bg-red-50'); yesLabel.querySelector('span').classList.add('text-red-600', 'font-medium'); }
        else if (type === '非会员') { noLabel.classList.add('border-red-400', 'bg-red-50'); noLabel.querySelector('span').classList.add('text-red-600', 'font-medium'); }
    }

    function closeAddUserModal() {
        const modal = document.getElementById('addUserModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        editingUserId = null;
    }

    // ============ 图片查看器 ============
    function previewImage(imgElementId) {
        const img = document.getElementById(imgElementId);
        const viewer = document.getElementById('imageViewer');
        const viewerImg = document.getElementById('imageViewerImg');
        viewerImg.src = img.src;
        viewer.classList.remove('hidden');
        viewer.classList.add('flex');
    }

    function closeImageViewer() {
        const viewer = document.getElementById('imageViewer');
        viewer.classList.add('hidden');
        viewer.classList.remove('flex');
    }

    // ============ 名片上传处理 ============
    function handleCardUpload(input) {
        const file = input.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) {
            alert('文件大小不能超过 5MB');
            input.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            addUserCardData = e.target.result;
            const preview = document.getElementById('cardPreviewImg');
            preview.src = addUserCardData;
            document.getElementById('cardUploadPlaceholder2').classList.add('hidden');
            document.getElementById('cardUploadPreview2').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    }

    function submitAddUser() {
        const name = document.getElementById('addUserName').value.trim();
        const company = document.getElementById('addUserCompany').value.trim();
        const position = document.getElementById('addUserPosition').value.trim();
        const phone = document.getElementById('addUserPhone').value.trim();
        const email = document.getElementById('addUserEmail').value.trim();
        const city = document.getElementById('addUserCity').value.trim();
        const years = parseInt(document.getElementById('addUserYears').value) || 0;
        const specialties = document.getElementById('addUserSpecialties').value.trim();
        const bio = document.getElementById('addUserBio').value.trim();
        const genderRadio = document.querySelector('input[name="addUserGender"]:checked');
        const gender = genderRadio ? genderRadio.value : '';
        const userTypeRadio = document.querySelector('input[name="userType"]:checked');
        const userType = userTypeRadio ? userTypeRadio.value : '';
        const memberRadio = document.querySelector('input[name="memberType"]:checked');
        const memberType = memberRadio ? memberRadio.value : '';

        if (!name) {
            document.getElementById('addUserName').classList.add('ring-2', 'ring-red-300');
            document.getElementById('addUserName').focus();
            setTimeout(() => document.getElementById('addUserName').classList.remove('ring-2', 'ring-red-300'), 1500);
            return;
        }
        if (!company) {
            document.getElementById('addUserCompany').classList.add('ring-2', 'ring-red-300');
            document.getElementById('addUserCompany').focus();
            setTimeout(() => document.getElementById('addUserCompany').classList.remove('ring-2', 'ring-red-300'), 1500);
            return;
        }
        if (!userType) {
            document.getElementById('userTypeBuyerLabel').classList.add('ring-2', 'ring-red-300');
            document.getElementById('userTypeSellerLabel').classList.add('ring-2', 'ring-red-300');
            setTimeout(() => {
                document.getElementById('userTypeBuyerLabel').classList.remove('ring-2', 'ring-red-300');
                document.getElementById('userTypeSellerLabel').classList.remove('ring-2', 'ring-red-300');
            }, 1500);
            return;
        }
        if (!memberType) {
            document.getElementById('memberYesLabel').classList.add('ring-2', 'ring-red-300');
            document.getElementById('memberNoLabel').classList.add('ring-2', 'ring-red-300');
            setTimeout(() => {
                document.getElementById('memberYesLabel').classList.remove('ring-2', 'ring-red-300');
                document.getElementById('memberNoLabel').classList.remove('ring-2', 'ring-red-300');
            }, 1500);
            return;
        }
        if (!gender) {
            alert('请选择性别');
            return;
        }
        if (!city) {
            document.getElementById('addUserCity').classList.add('ring-2', 'ring-red-300');
            document.getElementById('addUserCity').focus();
            setTimeout(() => document.getElementById('addUserCity').classList.remove('ring-2', 'ring-red-300'), 1500);
            return;
        }
        if (!specialties) {
            document.getElementById('addUserSpecialties').classList.add('ring-2', 'ring-red-300');
            document.getElementById('addUserSpecialties').focus();
            setTimeout(() => document.getElementById('addUserSpecialties').classList.remove('ring-2', 'ring-red-300'), 1500);
            return;
        }
        if (!bio) {
            document.getElementById('addUserBio').classList.add('ring-2', 'ring-red-300');
            document.getElementById('addUserBio').focus();
            setTimeout(() => document.getElementById('addUserBio').classList.remove('ring-2', 'ring-red-300'), 1500);
            return;
        }

        if (editingUserId) {
            // 编辑模式：更新已有用户
            const idx = users.findIndex(u => u.id === editingUserId);
            if (idx > -1) {
                users[idx] = { ...users[idx], name, phone: phone || '-', email: email || '-', company, position: position || '-', gender, city, years, specialties, bio, userType, memberType,
                    cardData: addUserCardData || users[idx].cardData };
            }
        } else {
            // 新增模式
            const newId = 'u' + (Date.now() % 100000);
            const newSeed = 'card' + Date.now();
            users.push({
                id: newId, name, phone: phone || '-', email: email || '-', company, position: position || '-', gender, city, years, specialties, bio,
                reviewStatus: 'pending', userType, memberType, cardSeed: newSeed, cardData: addUserCardData
            });
        }

        closeAddUserModal();
        render();
    }

    // ============ 点击弹窗外部关闭 ============
    document.getElementById('reviewModal').addEventListener('click', function(e) {
        if (e.target === this) closeReviewModal();
    });
    document.getElementById('addUserModal').addEventListener('click', function(e) {
        if (e.target === this) closeAddUserModal();
    });

    // ============ 初始渲染 ============
    render();
    </script>
</body>
</html>
