<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北极星管理平台 - 用户审核管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

        /* Filter button active state handled via JS class toggle */
        .filter-btn.active {
            background: white;
            color: #1f2937;
            font-weight: 500;
        }

        /* Modal backdrop */
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div id="app"></div>

    <!-- 审核弹窗 -->
    <div id="reviewModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
        <div class="bg-white rounded-2xl shadow-xl w-[480px] max-w-[90vw]">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="text-base font-semibold text-gray-800">用户审核</h3>
                <button onclick="closeReviewModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors cursor-pointer">
                    <i class="ri-close-line text-gray-400 text-lg"></i>
                </button>
            </div>
            <div class="px-6 py-5">
                <div id="reviewUserInfo" class="mb-5"></div>
                <div class="mb-4">
                    <label class="block text-sm text-gray-600 mb-2">审核结果</label>
                    <div class="flex gap-3">
                        <label class="flex items-center gap-2 px-4 py-2.5 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-green-400 transition-colors has-[:checked]:border-green-500 has-[:checked]:bg-green-50">
                            <input type="radio" name="reviewResult" value="approved" class="accent-green-500">
                            <span class="text-sm text-gray-700">审核通过</span>
                        </label>
                        <label class="flex items-center gap-2 px-4 py-2.5 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-red-400 transition-colors has-[:checked]:border-red-500 has-[:checked]:bg-red-50">
                            <input type="radio" name="reviewResult" value="rejected" class="accent-red-500">
                            <span class="text-sm text-gray-700">审核不通过</span>
                        </label>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="block text-sm text-gray-600 mb-2">审核备注 <span class="text-gray-400 font-normal">(选填)</span></label>
                    <textarea id="reviewRemark" rows="3" class="w-full px-4 py-2.5 text-sm border border-gray-200 rounded-lg resize-none focus:outline-none focus:border-red-400" placeholder="请输入审核备注..."></textarea>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
                <button onclick="closeReviewModal()" class="px-4 py-2 text-sm text-gray-500 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer">取消</button>
                <button onclick="submitReview()" class="px-4 py-2 text-sm text-white bg-red-500 rounded-lg hover:bg-red-600 transition-colors cursor-pointer">确认提交</button>
            </div>
        </div>
    </div>

    <!-- 新增用户弹窗 -->
    <div id="addUserModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
        <div class="bg-white rounded-xl shadow-xl w-[480px] max-w-[90vw]">
            <div class="flex items-center justify-between p-5 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-900">新增用户</h3>
                <button onclick="closeAddUserModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-colors"><i class="ri-close-line text-xl"></i></button>
            </div>
            <div class="p-5">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">用户姓名 <span class="text-red-500">*</span></label>
                        <input type="text" id="addUserName" class="w-full h-10 px-3 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-red-300 focus:ring-2 focus:ring-red-50" placeholder="请输入用户姓名">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">所属机构 <span class="text-red-500">*</span></label>
                        <input type="text" id="addUserCompany" class="w-full h-10 px-3 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-red-300 focus:ring-2 focus:ring-red-50" placeholder="请输入所属机构">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">职位</label>
                        <input type="text" id="addUserPosition" class="w-full h-10 px-3 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-red-300 focus:ring-2 focus:ring-red-50" placeholder="请输入职位">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">电话</label>
                            <input type="text" id="addUserPhone" class="w-full h-10 px-3 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-red-300 focus:ring-2 focus:ring-red-50" placeholder="请输入电话号码">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">邮箱</label>
                            <input type="text" id="addUserEmail" class="w-full h-10 px-3 rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-red-300 focus:ring-2 focus:ring-red-50" placeholder="请输入邮箱地址">
                        </div>
                    </div>
                    <!-- 名片上传 -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名片</label>
                        <div id="cardUploadArea" class="relative border-2 border-dashed border-gray-200 rounded-xl p-5 text-center hover:border-red-300 hover:bg-red-50/30 transition-colors cursor-pointer" onclick="document.getElementById('cardFileInput').click()">
                            <div id="cardUploadPlaceholder">
                                <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-2">
                                    <i class="ri-image-add-line text-gray-400 text-lg"></i>
                                </div>
                                <p class="text-sm text-gray-500">点击上传用户名片</p>
                                <p class="text-xs text-gray-400 mt-1">支持 JPG、PNG 格式</p>
                            </div>
                            <div id="cardUploadPreview" class="hidden">
                                <img id="cardPreviewImg" class="max-h-40 mx-auto rounded-lg shadow-sm" alt="名片预览">
                                <p class="text-xs text-gray-400 mt-2">点击重新上传</p>
                            </div>
                        </div>
                        <input type="file" id="cardFileInput" class="hidden" accept="image/jpeg,image/png,image/webp" onchange="handleCardUpload(this)">
                    </div>
                </div>
            </div>
            <div class="flex gap-3 p-5 pt-0">
                <button onclick="closeAddUserModal()" class="flex-1 h-10 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors text-sm cursor-pointer">取消</button>
                <button onclick="submitAddUser()" class="flex-1 h-10 rounded-lg bg-red-500 text-white hover:bg-red-600 transition-colors text-sm cursor-pointer">确认新增</button>
            </div>
        </div>
    </div>

    <script>
    // ============ 数据 ============
    // 模拟名片图颜色种子（用于生成不同风格的名片）
    const cardSeeds = ['finance1','fund2','securities3','invest4','research5','equity6','bond7','quant8','trade9','capital10','asset11','bank12'];

    const users = [
        { id: 'u1', name: '王建华', phone: '138****8801', email: 'wjh@example.com', company: '华夏基金', position: '基金经理', reviewStatus: 'approved', cardSeed: 'finance1' },
        { id: 'u2', name: '李梦琪', phone: '139****2234', email: 'lmq@example.com', company: '南方基金', position: '研究员', reviewStatus: 'approved', cardSeed: 'fund2' },
        { id: 'u3', name: '张伟', phone: '135****5567', email: 'zw@example.com', company: '招商证券', position: '分析师', reviewStatus: 'approved', cardSeed: 'securities3' },
        { id: 'u4', name: '陈晓燕', phone: '136****7890', email: 'cxy@example.com', company: '易方达基金', position: '投资总监', reviewStatus: 'pending', cardSeed: 'invest4' },
        { id: 'u5', name: '刘强', phone: '137****3312', email: 'lq@example.com', company: '广发证券', position: '策略分析师', reviewStatus: 'approved', cardSeed: 'research5' },
        { id: 'u6', name: '赵明', phone: '180****4456', email: 'zm@example.com', company: '中信证券', position: '科技行业分析师', reviewStatus: 'rejected', cardSeed: 'equity6' },
        { id: 'u7', name: '孙丽华', phone: '181****7723', email: 'slh@example.com', company: '国泰基金', position: '基金经理', reviewStatus: 'pending', cardSeed: 'bond7' },
        { id: 'u8', name: '周建国', phone: '182****8834', email: 'zjg@example.com', company: '平安资管', position: '量化研究员', reviewStatus: 'approved', cardSeed: 'quant8' },
        { id: 'u9', name: '吴晓峰', phone: '183****2245', email: 'wxf@example.com', company: '博时基金', position: '研究总监', reviewStatus: 'rejected', cardSeed: 'trade9' },
        { id: 'u10', name: '郑雅婷', phone: '184****5567', email: 'zyt@example.com', company: '汇添富基金', position: '基金经理', reviewStatus: 'pending', cardSeed: 'capital10' },
        { id: 'u11', name: '黄志远', phone: '185****6678', email: 'hzr@example.com', company: '工银瑞信', position: '固收基金经理', reviewStatus: 'approved', cardSeed: 'asset11' },
        { id: 'u12', name: '林思远', phone: '186****7789', email: 'lsr@example.com', company: '建信基金', position: '债券研究员', reviewStatus: 'pending', cardSeed: 'bank12' },
    ];

    // 当前新增用户弹窗中上传的名片数据
    let addUserCardData = null;

    let currentFilter = 'all';
    let searchKeyword = '';
    let reviewingUserId = null;

    // ============ 统计数据 ============
    function getStats() {
        const total = users.length;
        const pending = users.filter(u => u.reviewStatus === 'pending').length;
        const approved = users.filter(u => u.reviewStatus === 'approved').length;
        const rejected = users.filter(u => u.reviewStatus === 'rejected').length;
        return { total, pending, approved, rejected };
    }

    // ============ 过滤 & 搜索 ============
    function getFilteredUsers() {
        return users.filter(u => {
            const matchFilter = currentFilter === 'all' || u.reviewStatus === currentFilter;
            const matchSearch = searchKeyword === '' ||
                u.name.includes(searchKeyword) ||
                u.company.includes(searchKeyword) ||
                u.email.includes(searchKeyword) ||
                u.phone.includes(searchKeyword);
            return matchFilter && matchSearch;
        });
    }

    // ============ 渲染状态标签 ============
    function renderStatusTag(status) {
        const map = {
            pending: { label: '待审核', cls: 'bg-orange-50 text-orange-600' },
            approved: { label: '审核通过', cls: 'bg-green-50 text-green-600' },
            rejected: { label: '审核不通过', cls: 'bg-red-50 text-red-600' },
        };
        const s = map[status] || map.pending;
        return '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ' + s.cls + '">' + s.label + '</span>';
    }

    // ============ 渲染用户头像占位 ============
    function renderAvatar(name) {
        const colors = ['bg-red-100 text-red-600', 'bg-blue-100 text-blue-600', 'bg-green-100 text-green-600', 'bg-purple-100 text-purple-600', 'bg-amber-100 text-amber-600', 'bg-pink-100 text-pink-600'];
        const idx = name.charCodeAt(0) % colors.length;
        const cls = colors[idx];
        const initial = name.charAt(name.length - 2) + name.charAt(name.length - 1);
        return '<div class="w-9 h-9 rounded-full ' + cls + ' flex items-center justify-center flex-shrink-0 text-xs font-medium">' + initial + '</div>';
    }

    // ============ 渲染名片 SVG ============
    function renderCardSVG(user, width, height) {
        // 根据 cardSeed 生成不同配色的名片
        const seed = user.cardSeed || user.id;
        const colors = [
            { bg1: '#1a1a2e', bg2: '#16213e', accent: '#e94560' },
            { bg1: '#0f3460', bg2: '#16213e', accent: '#f0a500' },
            { bg1: '#1b1b3a', bg2: '#2d2d5e', accent: '#48c9b0' },
            { bg1: '#2c3e50', bg2: '#34495e', accent: '#e74c3c' },
            { bg1: '#1a3c40', bg2: '#1f4037', accent: '#f39c12' },
            { bg1: '#2d132c', bg2: '#3a1c3f', accent: '#ee4540' },
        ];
        const ci = Math.abs(seed.charCodeAt(0) % colors.length);
        const c = colors[ci];
        const name = user.name || '';
        const company = user.company || '';
        const position = user.position || '';
        const phone = user.phone || '';
        const email = user.email || '';

        return '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '" viewBox="0 0 540 320">' +
            '<defs><linearGradient id="cbg' + seed + '" x1="0%" y1="0%" x2="100%" y2="100%">' +
            '<stop offset="0%" style="stop-color:' + c.bg1 + '"/>' +
            '<stop offset="100%" style="stop-color:' + c.bg2 + '"/>' +
            '</linearGradient></defs>' +
            '<rect width="540" height="320" rx="16" fill="url(#cbg' + seed + ')"/>' +
            '<rect x="0" y="0" width="8" height="320" rx="4" fill="' + c.accent + '"/>' +
            '<circle cx="460" cy="60" r="40" fill="' + c.accent + '" opacity="0.1"/>' +
            '<circle cx="490" cy="100" r="25" fill="' + c.accent + '" opacity="0.08"/>' +
            '<text x="40" y="80" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">' + name + '</text>' +
            '<text x="40" y="115" font-family="sans-serif" font-size="14" fill="' + c.accent + '">' + position + '</text>' +
            '<text x="40" y="140" font-family="sans-serif" font-size="14" fill="' + c.accent + '">' + company + '</text>' +
            '<line x1="40" y1="165" x2="500" y2="165" stroke="white" stroke-opacity="0.1" stroke-width="1"/>' +
            '<text x="40" y="200" font-family="sans-serif" font-size="13" fill="white" fill-opacity="0.7">' +
            '<tspan fill="' + c.accent + '" fill-opacity="1">T</tspan>  ' + phone + '</text>' +
            '<text x="40" y="230" font-family="sans-serif" font-size="13" fill="white" fill-opacity="0.7">' +
            '<tspan fill="' + c.accent + '" fill-opacity="1">E</tspan>  ' + email + '</text>' +
            '<rect x="380" y="250" width="120" height="36" rx="18" fill="' + c.accent + '" fill-opacity="0.15"/>' +
            '<text x="440" y="273" font-family="sans-serif" font-size="12" fill="' + c.accent + '" text-anchor="middle">' + company.substring(0, 4) + '</text>' +
            '</svg>';
    }

    // ============ 侧边栏导航渲染 ============
    const navLinkMap = { '/experts': 'experts-clone.html', '/conferences': 'conferences.html', '/attendees': 'attendees.html', '/minutes': 'minutes.html', '/collections': 'collections.html', '/topics': 'topics.html', '/stocks': 'stocks.html', '/research': 'research.html', '/users': 'user-management.html', '/source-monitor': 'source-monitor.html', '/user-profile': 'user-profile.html' };
    function renderNavItem(path, icon, label, isSub, isActive) {
        const href = navLinkMap[path] || path.replace('/', '') + '.html';
        if (isSub) {
            return '<a class="flex items-center h-10 mx-2 mb-0.5 rounded-lg text-sm transition-colors cursor-pointer whitespace-nowrap pl-8 pr-4 ' + (isActive ? 'bg-red-50 text-red-600 font-medium' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-800') + '" href="' + href + '">' +
                '<div class="w-3 h-3 flex items-center justify-center mr-1 flex-shrink-0"><i class="ri-corner-down-right-line text-xs text-gray-300"></i></div>' +
                '<div class="w-5 h-5 flex items-center justify-center flex-shrink-0"><i class="' + icon + ' text-base"></i></div>' +
                '<span class="ml-2">' + label + '</span></a>';
        }
        return '<a class="flex items-center h-10 mx-2 mb-0.5 rounded-lg text-sm transition-colors cursor-pointer whitespace-nowrap px-4 ' + (isActive ? 'bg-red-50 text-red-600 font-medium' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-800') + '" href="' + href + '">' +
            '<div class="w-5 h-5 flex items-center justify-center flex-shrink-0"><i class="' + icon + ' text-base"></i></div>' +
            '<span class="ml-2">' + label + '</span></a>';
    }

    // ============ 主渲染函数 ============
    function render() {
        const stats = getStats();
        const filtered = getFilteredUsers();
        const app = document.getElementById('app');

        app.innerHTML = `
        <div class="flex h-screen bg-gray-50 font-sans overflow-hidden">
            <!-- 侧边栏 -->
            <aside class="flex flex-col bg-white border-r border-gray-100 transition-all duration-300 w-56 flex-shrink-0">
                <!-- Logo -->
                <div class="flex items-center h-16 px-4 border-b border-gray-100 cursor-pointer select-none">
                    <img alt="北极星" class="w-8 h-8 object-contain flex-shrink-0" src="https://static.readdy.ai/image/3dd3b08e3f41e718a9a692da40c4373e/36a1cddcc28d86e13fb969a9b2232329.png">
                    <span class="ml-2 text-sm font-semibold text-gray-800 whitespace-nowrap">北极星管理平台</span>
                </div>
                <!-- 导航 -->
                <nav class="flex-1 py-4 overflow-y-auto">
                    ${renderNavItem('/experts', 'ri-user-star-line', '专家管理', false, false)}
                    ${renderNavItem('/conferences', 'ri-video-chat-line', '专家会议管理', false, false)}
                    ${renderNavItem('/attendees', 'ri-team-line', '会议人员管理', true, false)}
                    ${renderNavItem('/minutes', 'ri-file-text-line', '专家纪要库', false, false)}
                    ${renderNavItem('/collections', 'ri-bookmark-3-line', '精选纪要集', true, false)}
                    ${renderNavItem('/topics', 'ri-pie-chart-line', '话题与板块&产业链', true, false)}
                    ${renderNavItem('/stocks', 'ri-stock-line', '话题与股票清单', true, false)}
                    ${renderNavItem('/research', 'ri-survey-line', '调研活动管理', false, false)}
                    ${renderNavItem('/users', 'ri-group-line', '用户审核管理', false, true)}
                    ${renderNavItem('/user-profile', 'ri-user-heart-line', '用户画像管理', false, false)}
                    ${renderNavItem('/source-monitor', 'ri-radar-line', '信源监控需求管理', false, false)}
                </nav>
                <!-- 返回按钮 -->
                <div class="border-t border-gray-100 p-3">
                    <button class="w-full flex items-center justify-center h-9 rounded-lg text-gray-400 hover:bg-gray-50 hover:text-gray-600 transition-colors cursor-pointer">
                        <div class="w-5 h-5 flex items-center justify-center"><i class="ri-arrow-left-s-line text-lg"></i></div>
                    </button>
                </div>
            </aside>

            <!-- 主区域 -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <!-- 顶栏 -->
                <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
                    <h1 class="text-base font-semibold text-gray-800">用户审核管理</h1>
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 flex items-center justify-center"><i class="ri-notification-3-line text-gray-400 text-lg"></i></div>
                        <div class="flex items-center gap-2 cursor-pointer">
                            <div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center">
                                <span class="text-xs font-medium text-red-600">管</span>
                            </div>
                            <span class="text-sm text-gray-600">管理员</span>
                            <div class="w-4 h-4 flex items-center justify-center"><i class="ri-arrow-down-s-line text-gray-400"></i></div>
                        </div>
                    </div>
                </header>

                <!-- 主内容 -->
                <main class="flex-1 overflow-y-auto p-6">
                    <!-- 看板 -->
                    <div class="grid grid-cols-4 gap-4 mb-6">
                        <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                            <div class="w-11 h-11 rounded-lg flex items-center justify-center text-red-500 bg-red-50">
                                <i class="ri-group-line text-xl"></i>
                            </div>
                            <div>
                                <div class="text-2xl font-semibold text-gray-800">${stats.total}</div>
                                <div class="text-xs text-gray-400 mt-0.5">已审核用户数</div>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                            <div class="w-11 h-11 rounded-lg flex items-center justify-center text-orange-500 bg-orange-50">
                                <i class="ri-time-line text-xl"></i>
                            </div>
                            <div>
                                <div class="text-2xl font-semibold text-gray-800">${stats.pending}</div>
                                <div class="text-xs text-gray-400 mt-0.5">待审核用户数</div>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                            <div class="w-11 h-11 rounded-lg flex items-center justify-center text-green-500 bg-green-50">
                                <i class="ri-checkbox-circle-line text-xl"></i>
                            </div>
                            <div>
                                <div class="text-2xl font-semibold text-gray-800">${stats.approved}</div>
                                <div class="text-xs text-gray-400 mt-0.5">审核通过</div>
                            </div>
                        </div>
                        <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                            <div class="w-11 h-11 rounded-lg flex items-center justify-center text-red-500 bg-red-50">
                                <i class="ri-close-circle-line text-xl"></i>
                            </div>
                            <div>
                                <div class="text-2xl font-semibold text-gray-800">${stats.rejected}</div>
                                <div class="text-xs text-gray-400 mt-0.5">审核不通过</div>
                            </div>
                        </div>
                    </div>

                    <!-- 表格区域 -->
                    <div class="bg-white rounded-xl">
                        <!-- 搜索 & 筛选栏 -->
                        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-50">
                            <div class="flex items-center gap-3">
                                <div class="relative">
                                    <div class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 flex items-center justify-center text-gray-400">
                                        <i class="ri-search-line text-sm"></i>
                                    </div>
                                    <input id="searchInput" placeholder="搜索用户姓名、机构、邮箱..." class="pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg w-64 focus:outline-none focus:border-red-400" value="${searchKeyword}">
                                </div>
                                <div class="flex items-center gap-1 bg-gray-50 rounded-lg p-1">
                                    <button class="filter-btn px-3 py-1 rounded-md text-sm transition-colors cursor-pointer whitespace-nowrap text-gray-500 hover:text-gray-700 ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">全部</button>
                                    <button class="filter-btn px-3 py-1 rounded-md text-sm transition-colors cursor-pointer whitespace-nowrap text-gray-500 hover:text-gray-700 ${currentFilter === 'pending' ? 'active' : ''}" onclick="setFilter('pending')">待审核</button>
                                    <button class="filter-btn px-3 py-1 rounded-md text-sm transition-colors cursor-pointer whitespace-nowrap text-gray-500 hover:text-gray-700 ${currentFilter === 'approved' ? 'active' : ''}" onclick="setFilter('approved')">审核通过</button>
                                    <button class="filter-btn px-3 py-1 rounded-md text-sm transition-colors cursor-pointer whitespace-nowrap text-gray-500 hover:text-gray-700 ${currentFilter === 'rejected' ? 'active' : ''}" onclick="setFilter('rejected')">审核不通过</button>
                                </div>
                            </div>
                            <button onclick="openAddUserModal()" class="flex items-center gap-2 px-4 py-2 bg-red-500 text-white text-sm rounded-lg hover:bg-red-600 transition-colors cursor-pointer whitespace-nowrap">
                                <div class="w-4 h-4 flex items-center justify-center"><i class="ri-add-line"></i></div>
                                新增用户
                            </button>
                        </div>

                        <!-- 表格 -->
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead>
                                    <tr class="text-xs text-gray-400 border-b border-gray-50">
                                        <th class="text-left px-5 py-3 font-medium">用户信息</th>
                                        <th class="text-left px-5 py-3 font-medium">所属机构</th>
                                        <th class="text-left px-5 py-3 font-medium">电话</th>
                                        <th class="text-left px-5 py-3 font-medium">邮箱</th>
                                        <th class="text-left px-5 py-3 font-medium">审核状态</th>
                                        <th class="text-left px-5 py-3 font-medium">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filtered.length === 0 ? `
                                        <tr><td colspan="6" class="px-5 py-16 text-center text-sm text-gray-400">
                                            <i class="ri-inbox-line text-4xl block mb-2 text-gray-300"></i>暂无数据
                                        </td></tr>
                                    ` : filtered.map(u => `
                                        <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">
                                            <td class="px-5 py-4">
                                                <div class="flex items-center gap-3">
                                                    ${renderAvatar(u.name)}
                                                    <div>
                                                        <div class="text-sm font-medium text-gray-800">${u.name}</div>
                                                        <div class="text-xs text-gray-400 mt-0.5">${u.position}</div>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="px-5 py-4 text-sm text-gray-600">${u.company}</td>
                                            <td class="px-5 py-4 text-sm text-gray-600">${u.phone}</td>
                                            <td class="px-5 py-4 text-sm text-gray-600">${u.email}</td>
                                            <td class="px-5 py-4">${renderStatusTag(u.reviewStatus)}</td>
                                            <td class="px-5 py-4">
                                                <button onclick="openReviewModal('${u.id}')" class="text-xs text-gray-500 hover:text-red-600 cursor-pointer whitespace-nowrap px-2 py-1 rounded hover:bg-red-50 transition-colors">审核</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <!-- 分页信息 -->
                        <div class="px-5 py-3 text-xs text-gray-400 border-t border-gray-50 flex items-center justify-between">
                            <span>共 ${filtered.length} 条记录</span>
                            <div class="flex items-center gap-1">
                                <button class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 text-gray-400 cursor-pointer"><i class="ri-arrow-left-s-line"></i></button>
                                <button class="w-8 h-8 flex items-center justify-center rounded bg-red-500 text-white text-xs font-medium cursor-pointer">1</button>
                                <button class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 text-xs text-gray-500 cursor-pointer">2</button>
                                <button class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 text-gray-400 cursor-pointer"><i class="ri-arrow-right-s-line"></i></button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>`;

        // 绑定搜索事件
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                searchKeyword = e.target.value;
                render();
            });
            // 恢复焦点和光标位置
            if (searchKeyword) {
                searchInput.focus();
                searchInput.setSelectionRange(searchKeyword.length, searchKeyword.length);
            }
        }
    }

    // ============ 筛选 ============
    function setFilter(filter) {
        currentFilter = filter;
        render();
    }

    // ============ 审核弹窗 ============
    function openReviewModal(userId) {
        reviewingUserId = userId;
        const user = users.find(u => u.id === userId);
        if (!user) return;

        document.getElementById('reviewUserInfo').innerHTML = `
            <div class="flex gap-4">
                <div class="flex-1">
                    <div class="flex items-center gap-3 p-4 bg-gray-50 rounded-xl">
                        ${renderAvatar(user.name)}
                        <div>
                            <div class="text-sm font-medium text-gray-800">${user.name}</div>
                            <div class="text-xs text-gray-400">${user.position} · ${user.company}</div>
                            <div class="text-xs text-gray-400 mt-1">${user.phone} · ${user.email}</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="mt-3">
                <div class="text-xs text-gray-400 mb-2 font-medium">用户名片</div>
                <div class="rounded-lg overflow-hidden border border-gray-200 bg-gray-50">
                    ${user.cardData
                        ? '<img src="' + user.cardData + '" class="w-full h-auto" alt="用户名片">'
                        : '<img src="data:image/svg+xml,' + encodeURIComponent(renderCardSVG(user, 540, 320)) + '" class="w-full h-auto" alt="用户名片">'
                    }
                </div>
            </div>
        `;

        // 重置表单
        document.querySelectorAll('input[name="reviewResult"]').forEach(r => r.checked = false);
        document.getElementById('reviewRemark').value = '';

        const modal = document.getElementById('reviewModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closeReviewModal() {
        const modal = document.getElementById('reviewModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        reviewingUserId = null;
    }

    function submitReview() {
        const result = document.querySelector('input[name="reviewResult"]:checked');
        if (!result) {
            const radios = document.querySelector('input[name="reviewResult"]');
            radios.closest('div').classList.add('ring-2', 'ring-red-300', 'rounded-lg');
            setTimeout(() => radios.closest('div').classList.remove('ring-2', 'ring-red-300', 'rounded-lg'), 1500);
            return;
        }

        const user = users.find(u => u.id === reviewingUserId);
        if (user) {
            user.reviewStatus = result.value;
        }

        closeReviewModal();
        render();
    }

    // ============ 新增用户弹窗 ============
    function openAddUserModal() {
        // 清空表单
        document.getElementById('addUserName').value = '';
        document.getElementById('addUserCompany').value = '';
        document.getElementById('addUserPosition').value = '';
        document.getElementById('addUserPhone').value = '';
        document.getElementById('addUserEmail').value = '';

        // 重置名片上传
        addUserCardData = null;
        document.getElementById('cardUploadPlaceholder').classList.remove('hidden');
        document.getElementById('cardUploadPreview').classList.add('hidden');
        document.getElementById('cardFileInput').value = '';

        const modal = document.getElementById('addUserModal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closeAddUserModal() {
        const modal = document.getElementById('addUserModal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    // ============ 名片上传处理 ============
    function handleCardUpload(input) {
        const file = input.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) {
            alert('文件大小不能超过 5MB');
            input.value = '';
            return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
            addUserCardData = e.target.result;
            const preview = document.getElementById('cardPreviewImg');
            preview.src = addUserCardData;
            document.getElementById('cardUploadPlaceholder').classList.add('hidden');
            document.getElementById('cardUploadPreview').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    }

    function submitAddUser() {
        const name = document.getElementById('addUserName').value.trim();
        const company = document.getElementById('addUserCompany').value.trim();
        const position = document.getElementById('addUserPosition').value.trim();
        const phone = document.getElementById('addUserPhone').value.trim();
        const email = document.getElementById('addUserEmail').value.trim();

        if (!name) {
            document.getElementById('addUserName').classList.add('ring-2', 'ring-red-300');
            document.getElementById('addUserName').focus();
            setTimeout(() => document.getElementById('addUserName').classList.remove('ring-2', 'ring-red-300'), 1500);
            return;
        }
        if (!company) {
            document.getElementById('addUserCompany').classList.add('ring-2', 'ring-red-300');
            document.getElementById('addUserCompany').focus();
            setTimeout(() => document.getElementById('addUserCompany').classList.remove('ring-2', 'ring-red-300'), 1500);
            return;
        }

        const newId = 'u' + (Date.now() % 100000);
        const newSeed = 'card' + Date.now();
        users.push({
            id: newId,
            name: name,
            phone: phone || '-',
            email: email || '-',
            company: company,
            position: position || '-',
            reviewStatus: 'pending',
            cardSeed: newSeed,
            cardData: addUserCardData  // 存储上传的名片 base64
        });

        closeAddUserModal();
        render();
    }

    // ============ 点击弹窗外部关闭 ============
    document.getElementById('reviewModal').addEventListener('click', function(e) {
        if (e.target === this) closeReviewModal();
    });
    document.getElementById('addUserModal').addEventListener('click', function(e) {
        if (e.target === this) closeAddUserModal();
    });

    // ============ 初始渲染 ============
    render();
    </script>
</body>
</html>
