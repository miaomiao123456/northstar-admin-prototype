        const workbenchCount = users.filter(u => u.usingWorkbench).length;
        return { onlineCount, meetingCount, workbenchCount };
    }

    // ============ 过滤 & 搜索 ============
    function getFilteredUsers() {
        return users.filter(u => {
            let matchFilter = currentFilter === 'all';
            if (currentFilter === 'online') matchFilter = u.online;
            if (currentFilter === 'meeting') matchFilter = u.inMeeting;
            if (currentFilter === 'workbench') matchFilter = u.usingWorkbench;
            const matchSearch = searchKeyword === '' ||
                u.name.includes(searchKeyword) ||
                u.company.includes(searchKeyword) ||
                u.position.includes(searchKeyword);
            return matchFilter && matchSearch;
        });

        return '<div class="w-9 h-9 rounded-full ' + cls + ' flex items-center justify-center flex-shrink-0 text-xs font-medium">' + initial + '</div>';

                                '<div class="relative">' +
                                    '<div class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 flex items-center justify-center text-gray-400"><i class="ri-search-line text-sm"></i></div>' +
                                    '<input id="searchInput" placeholder="搜索用户姓名、机构..." class="pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg w-64 focus:outline-none focus:border-red-400" value="' + searchKeyword + '">' +
                                '</div>' +
                                '<div class="flex items-center gap-1 bg-gray-50 rounded-lg p-1">' +
                                    '<button class="filter-btn px-3 py-1 rounded-md text-sm transition-colors cursor-pointer whitespace-nowrap text-gray-500 hover:text-gray-700 ' + (currentFilter === 'all' ? 'active' : '') + '" onclick="setFilter(\'all\')">全部</button>' +
                                    '<button class="filter-btn px-3 py-1 rounded-md text-sm transition-colors cursor-pointer whitespace-nowrap text-gray-500 hover:text-gray-700 ' + (currentFilter === 'online' ? 'active' : '') + '" onclick="setFilter(\'online\')">在线</button>' +
                                    '<button class="filter-btn px-3 py-1 rounded-md text-sm transition-colors cursor-pointer whitespace-nowrap text-gray-500 hover:text-gray-700 ' + (currentFilter === 'meeting' ? 'active' : '') + '" onclick="setFilter(\'meeting\')">会议中</button>' +
                                    '<button class="filter-btn px-3 py-1 rounded-md text-sm transition-colors cursor-pointer whitespace-nowrap text-gray-500 hover:text-gray-700 ' + (currentFilter === 'workbench' ? 'active' : '') + '" onclick="setFilter(\'workbench\')">工作台使用中</button>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +

                        '<!-- 表格 -->' +
                        '<div class="overflow-x-auto">' +
                            '<table class="w-full">' +
                                '<thead>' +
                                    '<tr class="text-xs text-gray-400 border-b border-gray-50">' +
                                        '<th class="text-left px-5 py-3 font-medium min-w-[200px]">用户信息</th>' +
                                        '<th class="text-left px-5 py-3 font-medium min-w-[140px]">所属机构</th>' +
                                        '<th class="text-left px-5 py-3 font-medium min-w-[100px]">在线状态</th>' +
                                        '<th class="text-left px-5 py-3 font-medium min-w-[100px]">参会状态</th>' +
                                        '<th class="text-left px-5 py-3 font-medium min-w-[80px]">预约</th>' +
                                        '<th class="text-left px-5 py-3 font-medium min-w-[80px]">监控需求</th>' +
                                    '</tr>' +
                                '</thead>' +
                                '<tbody>' +
                                    (filtered.length === 0 ?
                                        '<tr><td colspan="6" class="px-5 py-16 text-center text-sm text-gray-400"><i class="ri-inbox-line text-4xl block mb-2 text-gray-300"></i>暂无数据</td></tr>' :
                                        filtered.map(function(u) {
                                            return '<tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors">' +
                                                '<td class="px-5 py-4">' +
                                                    '<div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity" onclick="showUserDetail(\'' + u.id + '\')">' +
                                                        renderAvatar(u.name) +
                                                        '<div>' +
                                                            '<div class="text-sm font-medium text-gray-800">' + u.name + '</div>' +
                                                            '<div class="text-xs text-gray-400 mt-0.5">' + u.position + '</div>' +
                                                        '</div>' +
                                                    '</div>' +
                                                '</td>' +
                                                '<td class="px-5 py-4"><span class="text-sm text-gray-600">' + u.company + '</span></td>' +
                                                '<td class="px-5 py-4">' +
                                                    '<div class="flex items-center cursor-pointer hover:opacity-80 transition-opacity" onclick="showOnlineDetail(\'' + u.id + '\')">' +
                                                        '<span class="online-dot ' + (u.online ? 'green' : 'gray') + '"></span>' +
                                                        '<span class="text-sm ' + (u.online ? 'text-green-600 font-medium' : 'text-gray-400') + '">' + (u.online ? '在线' : '不在线') + '</span>' +
                                                    '</div>' +
                                                '</td>' +
                                                '<td class="px-5 py-4">' +
                                                    '<div class="cursor-pointer hover:opacity-80 transition-opacity" onclick="showMeetingDetail(\'' + u.id + '\')">' +
                                                        (u.inMeeting ?
                                                            renderTag('参会中', 'bg-blue-50 text-blue-600') :
                                                            renderTag('未参会', 'bg-gray-100 text-gray-400')) +
                                                    '</div>' +
                                                '</td>' +
                                                '<td class="px-5 py-4">' +
                                                    '<div class="cursor-pointer hover:opacity-80 transition-opacity" onclick="showAppointmentDetail(\'' + u.id + '\')">' +
                                                        '<span class="text-sm text-gray-600 font-medium">' + u.appointments.length + '</span>' +
                                                        (u.appointments.length > 0 ? '<span class="text-xs text-gray-400 ml-1">场</span>' : '') +
                                                    '</div>' +
                                                '</td>' +
                                                '<td class="px-5 py-4">' +
                                                    '<div class="cursor-pointer hover:opacity-80 transition-opacity" onclick="showDemandDetail(\'' + u.id + '\')">' +
                                                        '<span class="text-sm text-gray-600 font-medium">' + u.demands.length + '</span>' +
                                                        (u.demands.length > 0 ? '<span class="text-xs text-gray-400 ml-1">条</span>' : '') +
                                                    '</div>' +
                                                '</td>' +
                                            '</tr>';
                                        }).join('')) +
                                '</tbody>' +
                            '</table>' +
                        '</div>' +

                        '<!-- 分页 -->' +
                        '<div class="px-5 py-3 text-xs text-gray-400 border-t border-gray-50 flex items-center justify-between">' +
                            '<span>共 ' + filtered.length + ' 条记录</span>' +
                            '<div class="flex items-center gap-1">' +
                                '<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 text-gray-400 cursor-pointer"><i class="ri-arrow-left-s-line"></i></button>' +
                                '<button class="w-8 h-8 flex items-center justify-center rounded bg-red-500 text-white text-xs font-medium cursor-pointer">1</button>' +
                                '<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 text-xs text-gray-500 cursor-pointer">2</button>' +
                                '<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-100 text-gray-400 cursor-pointer"><i class="ri-arrow-right-s-line"></i></button>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +
                '</main>' +
            '</div>' +
        '</div>';

        // 绑定搜索
        var searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', function(e) {
                searchKeyword = e.target.value;
                render();
            });
            if (searchKeyword) {
                searchInput.focus();
                searchInput.setSelectionRange(searchKeyword.length, searchKeyword.length);
            }
        }
    }

    // ============ 筛选 ============
    function setFilter(filter) {
        currentFilter = filter;
        render();
    }

    // ============ 弹窗控制 ============
    function openModal(id) {
        var m = document.getElementById(id);
        m.classList.remove('hidden');
        m.classList.add('flex');
    }
    function closeModal(id) {
        var m = document.getElementById(id);
        m.classList.add('hidden');
        m.classList.remove('flex');
    }

    // ============ 用户详情弹窗 ============
    function showUserDetail(userId) {
        var u = users.find(function(x) { return x.id === userId; });
        if (!u) return;
        document.getElementById('userDetailBody').innerHTML =
            '<div class="flex items-center gap-3 mb-5">' +
                renderAvatar(u.name) +
                '<div>' +
                    '<div class="text-base font-semibold text-gray-800">' + u.name + '</div>' +
                    '<div class="text-sm text-gray-400">' + u.position + ' · ' + u.company + '</div>' +
                '</div>' +
            '</div>' +
            '<div class="space-y-3">' +
                '<div class="flex items-center gap-3 px-4 py-3 bg-gray-50 rounded-xl">' +
                    '<div class="w-8 h-8 flex items-center justify-center"><i class="ri-user-line text-gray-400"></i></div>' +
                    '<div><div class="text-xs text-gray-400">姓名</div><div class="text-sm text-gray-800 font-medium">' + u.name + '</div></div>' +
                '</div>' +
                '<div class="flex items-center gap-3 px-4 py-3 bg-gray-50 rounded-xl">' +
                    '<div class="w-8 h-8 flex items-center justify-center"><i class="ri-briefcase-line text-gray-400"></i></div>' +
                    '<div><div class="text-xs text-gray-400">职位</div><div class="text-sm text-gray-800 font-medium">' + u.position + '</div></div>' +
                '</div>' +
                '<div class="flex items-center gap-3 px-4 py-3 bg-gray-50 rounded-xl">' +
                    '<div class="w-8 h-8 flex items-center justify-center"><i class="ri-building-line text-gray-400"></i></div>' +
                    '<div><div class="text-xs text-gray-400">所属机构</div><div class="text-sm text-gray-800 font-medium">' + u.company + '</div></div>' +
                '</div>' +
                '<div class="flex items-center gap-3 px-4 py-3 bg-gray-50 rounded-xl">' +
                    '<div class="w-8 h-8 flex items-center justify-center"><i class="ri-phone-line text-gray-400"></i></div>' +
                    '<div><div class="text-xs text-gray-400">电话</div><div class="text-sm text-gray-800 font-medium">' + u.phone + '</div></div>' +
                '</div>' +
                '<div class="flex items-center gap-3 px-4 py-3 bg-gray-50 rounded-xl">' +
                    '<div class="w-8 h-8 flex items-center justify-center"><i class="ri-mail-line text-gray-400"></i></div>' +
                    '<div><div class="text-xs text-gray-400">邮箱</div><div class="text-sm text-gray-800 font-medium">' + u.email + '</div></div>' +
                '</div>' +
            '</div>';
        openModal('userDetailModal');
    }

    // ============ 在线状态弹窗 ============
    function showOnlineDetail(userId) {
        var u = users.find(function(x) { return x.id === userId; });
        if (!u) return;
        var days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
        var onlineDays = 0;
        var weekHtml = '<div class="flex items-center gap-3 mb-4">' +
            renderAvatar(u.name) +
            '<div>' +
                '<div class="text-sm font-medium text-gray-800">' + u.name + '</div>' +
                '<div class="text-xs text-gray-400">' + u.company + '</div>' +
            '</div>' +
        '</div>' +
        '<div class="text-xs text-gray-400 mb-3 font-medium">本周每日在线时长（小时）</div>' +
        '<div class="space-y-2.5">';
        days.forEach(function(day) {
            var hours = u.weekOnline[day] || 0;
            if (hours > 0) onlineDays++;
            var barWidth = Math.max(0, Math.min(100, (hours / 10) * 100));
            var barColor = hours > 6 ? 'bg-green-500' : hours > 3 ? 'bg-amber-400' : hours > 0 ? 'bg-orange-300' : 'bg-gray-200';
            weekHtml += '<div class="flex items-center gap-3">' +
                '<span class="text-xs text-gray-500 w-8 text-right">' + day + '</span>' +
                '<div class="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden">' +
                    '<div class="week-bar ' + barColor + '" style="width: ' + barWidth + '%"></div>' +
                '</div>' +
                '<span class="text-xs text-gray-500 w-10">' + (hours > 0 ? hours.toFixed(1) + 'h' : '-') + '</span>' +
            '</div>';
        });
        weekHtml += '</div>' +
            '<div class="mt-4 px-4 py-3 bg-green-50 rounded-xl flex items-center gap-2">' +
                '<i class="ri-calendar-check-line text-green-500"></i>' +
                '<span class="text-sm text-green-700">本周在线 <strong>' + onlineDays + '</strong> 天</span>' +
            '</div>';
        document.getElementById('onlineModalBody').innerHTML = weekHtml;
        openModal('onlineModal');
    }

    // ============ 参会状态弹窗 ============
    function showMeetingDetail(userId) {
        var u = users.find(function(x) { return x.id === userId; });
        if (!u) return;
        var html = '<div class="flex items-center gap-3 mb-4">' +
            renderAvatar(u.name) +
            '<div>' +
                '<div class="text-sm font-medium text-gray-800">' + u.name + '</div>' +
                '<div class="text-xs text-gray-400">' + u.company + '</div>' +
            '</div>' +
        '</div>';

        if (u.inMeeting) {
            html += '<div class="mb-4">' +
                '<div class="text-xs text-gray-400 mb-2 font-medium">当前参与的会议</div>' +
                '<div class="px-4 py-3 bg-blue-50 rounded-xl flex items-center gap-3">' +
                    '<div class="w-8 h-8 rounded-lg bg-blue-100 flex items-center justify-center"><i class="ri-video-chat-line text-blue-500"></i></div>' +
                    '<div class="flex-1">' +
                        '<div class="text-sm font-medium text-gray-800">' + u.currentMeeting + '</div>' +
                        '<div class="text-xs text-blue-500 mt-0.5"><span class="online-dot green"></span>进行中</div>' +
                    '</div>' +
                '</div>' +
            '</div>';
        } else {
            html += '<div class="mb-4">' +
                '<div class="text-xs text-gray-400 mb-2 font-medium">当前参会状态</div>' +
                '<div class="px-4 py-3 bg-gray-50 rounded-xl flex items-center gap-3">' +
                    '<div class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center"><i class="ri-video-chat-line text-gray-400"></i></div>' +
                    '<span class="text-sm text-gray-500">当前无参会</span>' +
                '</div>' +
            '</div>';
        }

        html += '<div>' +
            '<div class="text-xs text-gray-400 mb-2 font-medium">历史参会统计</div>' +
            '<div class="px-4 py-3 bg-gray-50 rounded-xl flex items-center gap-3">' +
                '<div class="w-8 h-8 rounded-lg bg-purple-100 flex items-center justify-center"><i class="ri-bar-chart-line text-purple-500"></i></div>' +
                '<div>' +
                    '<span class="text-xl font-semibold text-gray-800">' + u.totalMeetings + '</span>' +
                    '<span class="text-sm text-gray-500 ml-2">累计参会场次</span>' +
                '</div>' +
            '</div>' +
        '</div>';

        document.getElementById('meetingModalBody').innerHTML = html;
        openModal('meetingModal');
    }

    // ============ 预约详情弹窗 ============
    function showAppointmentDetail(userId) {
        var u = users.find(function(x) { return x.id === userId; });
        if (!u) return;
        var html = '<div class="flex items-center gap-3 mb-4">' +
            renderAvatar(u.name) +
            '<div>' +
                '<div class="text-sm font-medium text-gray-800">' + u.name + '</div>' +
                '<div class="text-xs text-gray-400">' + u.company + '</div>' +
            '</div>' +
        '</div>' +
        '<div class="text-xs text-gray-400 mb-2 font-medium">预约会议（共 ' + u.appointments.length + ' 场）</div>';

        if (u.appointments.length === 0) {
            html += '<div class="px-4 py-8 text-center text-sm text-gray-400">' +
                '<i class="ri-calendar-line text-3xl block mb-2 text-gray-300"></i>暂无预约' +
            '</div>';
        } else {
            html += '<div class="space-y-2">';
            u.appointments.forEach(function(a) {
                var statusTag = a.status === 'confirmed' ?
                    '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-600">已确认</span>' :
                    '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-amber-50 text-amber-600">待确认</span>';
                html += '<div class="px-4 py-3 bg-gray-50 rounded-xl flex items-center gap-3">' +
                    '<div class="w-8 h-8 rounded-lg bg-orange-100 flex items-center justify-center flex-shrink-0"><i class="ri-calendar-event-line text-orange-500"></i></div>' +
                    '<div class="flex-1 min-w-0">' +
                        '<div class="text-sm font-medium text-gray-800 truncate">' + a.title + '</div>' +
                        '<div class="text-xs text-gray-400 mt-0.5">' + a.date + '</div>' +
                    '</div>' +
                    statusTag +
                '</div>';
            });
            html += '</div>';
        }

        document.getElementById('appointmentModalBody').innerHTML = html;
        openModal('appointmentModal');
    }

    // ============ 监控需求弹窗 ============
    function showDemandDetail(userId) {
        var u = users.find(function(x) { return x.id === userId; });
        if (!u) return;
        var html = '<div class="flex items-center gap-3 mb-4">' +
            renderAvatar(u.name) +
            '<div>' +
                '<div class="text-sm font-medium text-gray-800">' + u.name + '</div>' +
                '<div class="text-xs text-gray-400">' + u.company + '</div>' +
            '</div>' +
        '</div>' +
        '<div class="text-xs text-gray-400 mb-2 font-medium">监控需求（共 ' + u.demands.length + ' 条）</div>';

        if (u.demands.length === 0) {
            html += '<div class="px-4 py-8 text-center text-sm text-gray-400">' +
                '<i class="ri-radar-line text-3xl block mb-2 text-gray-300"></i>暂无需求' +
            '</div>';
        } else {
            html += '<div class="space-y-2">';
            u.demands.forEach(function(d) {
                var statusMap = { pending: { label: '待处理', cls: 'bg-orange-50 text-orange-600' }, processing: { label: '处理中', cls: 'bg-blue-50 text-blue-600' }, done: { label: '已处理', cls: 'bg-green-50 text-green-600' } };
                var s = statusMap[d.status] || statusMap.pending;
                html += '<div class="px-4 py-3 bg-gray-50 rounded-xl">' +
                    '<div class="flex items-center justify-between mb-1">' +
                        '<span class="text-sm font-medium text-gray-800">' + d.title + '</span>' +
                        '<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ' + s.cls + '">' + s.label + '</span>' +
                    '</div>' +
                '</div>';
            });
            html += '</div>';
        }

        document.getElementById('demandModalBody').innerHTML = html;
        openModal('demandModal');
    }

    // ============ 弹窗外部关闭 ============
    ['userDetailModal', 'onlineModal', 'meetingModal', 'appointmentModal', 'demandModal'].forEach(function(id) {
        document.getElementById(id).addEventListener('click', function(e) {
            if (e.target === this) closeModal(id);
        });
    });

    // ============ 初始渲染 ============
    render();
    </script>
</body>
</html>
