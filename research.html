};

    }

function getStats() {
    const s = (v) => researches.filter(r => r.status === v).length;
    const f = (v) => researches.filter(r => r.followStatus === v).length;
    return { total: researches.length, pending: s('待审核'), ongoing: s('进行中')+s('已批准'), completed: s('已完成'), overdue: f('已逾期') };
}

function getFiltered() {
    return researches.filter(r => {
        const matchSearch = !searchQuery || r.title.includes(searchQuery) || r.target.includes(searchQuery) || r.applicant.includes(searchQuery);
        const matchStatus = activeStatus === '全部状态' || r.status === activeStatus;
        const matchFollow = activeFollow === '全部跟进' || r.followStatus === activeFollow;
        const matchType = activeType === '全部类型' || r.type === activeType;
        return matchSearch && matchStatus && matchFollow && matchType;
    });
}

    const m = { '待审核':'bg-yellow-50 text-yellow-600','已批准':'bg-blue-50 text-blue-500','进行中':'bg-green-50 text-green-600','已完成':'bg-gray-100 text-gray-500','已拒绝':'bg-red-50 text-red-500','已取消':'bg-gray-50 text-gray-400' };
    return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${m[s]||'bg-gray-100 text-gray-500'}">${s}</span>`;
}

function getFollowBadge(s) {
    const m = { '未跟进':'bg-gray-100 text-gray-500','跟进中':'bg-blue-50 text-blue-500','等待回复':'bg-yellow-50 text-yellow-600','跟进完成':'bg-green-50 text-green-600','已逾期':'bg-red-50 text-red-500' };
    return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${m[s]||'bg-gray-100 text-gray-500'}">${s}</span>`;
}

function getPriorityBadge(p) {
    const m = { '高':'bg-red-50 text-red-500','中':'bg-yellow-50 text-yellow-600','低':'bg-gray-100 text-gray-400' };
    return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${m[p]||'bg-gray-100 text-gray-400'}">${p}</span>`;
}

}

                                    </td>
                                    <td class="px-5 py-4 text-gray-600 text-sm">${r.date}</td>
                                    <td class="px-5 py-4">${getStatusBadge(r.status)}</td>
                                    <td class="px-5 py-4">${getFollowBadge(r.followStatus)}</td>
                                    <td class="px-5 py-4 text-gray-600 text-sm">${r.follower || '-'}</td>
                                    <td class="px-5 py-4">
                                        <div class="flex items-center gap-2">
                                            <button onclick="openDetailModal('${r.id}')" class="px-2.5 py-1 rounded-md bg-gray-50 text-gray-600 text-xs hover:bg-gray-100 transition-colors cursor-pointer">详情</button>
                                            ${r.status === '待审核' ? `<button onclick="updateStatus('${r.id}','已批准')" class="px-2.5 py-1 rounded-md bg-green-50 text-green-600 text-xs hover:bg-green-100 transition-colors cursor-pointer">批准</button><button onclick="updateStatus('${r.id}','已拒绝')" class="px-2.5 py-1 rounded-md bg-red-50 text-red-500 text-xs hover:bg-red-100 transition-colors cursor-pointer">拒绝</button>` : ''}
                                            <button onclick="openResearchModal('${r.id}')" class="px-2.5 py-1 rounded-md bg-gray-50 text-gray-600 text-xs hover:bg-gray-100 transition-colors cursor-pointer">编辑</button>
                                            <button onclick="openDeleteModal('${r.id}')" class="px-2.5 py-1 rounded-md bg-gray-50 text-gray-600 text-xs hover:bg-red-50 hover:text-red-500 transition-colors cursor-pointer">删除</button>
                                        </div>
                                    </td>
                                </tr>`).join('')}
                            </tbody>
                        </table>
                        ${filtered.length === 0 ? '<div class="py-16 text-center text-gray-400"><i class="ri-inbox-line text-4xl mb-2 block"></i>暂无数据</div>' : ''}
                    </div>
                    <div class="px-5 py-3 border-t border-gray-50 text-sm text-gray-400">共 ${filtered.length} 条记录</div>
                </div>
            </main>
        </div>
    </div>`;
}

function updateStatus(id, status) {
    const r = researches.find(x => x.id === id);
    if (r) { r.status = status; render(); }
}

function openDetailModal(id) {
    const r = researches.find(x => x.id === id);
    if (!r) return;
    document.getElementById('detailModalBody').innerHTML = `
        <div class="space-y-4">
            <div class="flex items-center gap-2 mb-2">
                <i class="${getTypeIcon(r.type)} text-gray-400"></i>
                <span class="px-2 py-0.5 rounded text-xs text-gray-500 bg-gray-50">${r.type}</span>
                ${getPriorityBadge(r.priority)}
            </div>
            <h3 class="text-lg font-semibold text-gray-900">${r.title}</h3>
            <p class="text-gray-500 text-sm">${r.desc}</p>
            <div class="flex flex-wrap gap-1">${r.tags.map(t => `<span class="px-2 py-0.5 rounded-md bg-gray-50 text-gray-500 text-xs">${t}</span>`).join('')}</div>
            <div class="grid grid-cols-2 gap-4">
                <div><div class="text-xs text-gray-400 mb-1">申请人</div><div class="text-gray-700">${r.applicant} (${r.applicantInst})</div></div>
                <div><div class="text-xs text-gray-400 mb-1">调研对象</div><div class="text-gray-700">${r.target}</div></div>
                <div><div class="text-xs text-gray-400 mb-1">预期日期</div><div class="text-gray-700">${r.date}</div></div>
                <div><div class="text-xs text-gray-400 mb-1">申请状态</div>${getStatusBadge(r.status)}</div>
                <div><div class="text-xs text-gray-400 mb-1">跟进状态</div>${getFollowBadge(r.followStatus)}</div>
                <div><div class="text-xs text-gray-400 mb-1">跟进人</div><div class="text-gray-700">${r.follower || '暂无'}</div></div>
            </div>
        </div>`;
    showModal('detailModal');
}

function openResearchModal(id) {
    editingId = id || null;
    const r = id ? researches.find(x => x.id === id) : null;
    document.getElementById('researchModalTitle').textContent = r ? '编辑调研申请' : '新增调研申请';
    document.getElementById('researchModalBody').innerHTML = `
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">调研标题</label>
                <input id="rTitle" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400" value="${r?r.title:''}" placeholder="输入调研标题">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">调研类型</label>
                    <select id="rType" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400">
                        ${typeFilters.filter(t=>t!=='全部类型').map(t => `<option ${r&&r.type===t?'selected':''}>${t}</option>`).join('')}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">优先级</label>
                    <select id="rPriority" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400">
                        <option value="高" ${r&&r.priority==='高'?'selected':''}>高</option>
                        <option value="中" ${!r||r.priority==='中'?'selected':''}>中</option>
                        <option value="低" ${r&&r.priority==='低'?'selected':''}>低</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">调研对象</label>
                    <input id="rTarget" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400" value="${r?r.target:''}" placeholder="调研对象名称">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">所属行业</label>
                    <input id="rIndustry" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400" value="${r?r.targetIndustry:''}" placeholder="行业">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">预期日期</label>
                <input id="rDate" type="date" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400" value="${r?r.date:''}">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">话题标签</label>
                <input id="rTags" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400" value="${r?r.tags.join('、'):''}" placeholder="输入标签，多个用顿号分隔">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">调研描述</label>
                <textarea id="rDesc" rows="3" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400 resize-none" placeholder="输入调研目的与内容">${r?r.desc:''}</textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="closeModal('researchModal')" class="flex-1 h-10 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors text-sm cursor-pointer">取消</button>
                <button onclick="saveResearch()" class="flex-1 h-10 rounded-lg bg-red-500 text-white hover:bg-red-600 transition-colors text-sm cursor-pointer">保存</button>
            </div>
        </div>`;
    showModal('researchModal');
}

function saveResearch() {
    const title = document.getElementById('rTitle').value.trim();
    if (!title) { alert('请输入调研标题'); return; }
    const data = {
        title,
        type: document.getElementById('rType').value,
        priority: document.getElementById('rPriority').value,
        target: document.getElementById('rTarget').value.trim(),
        targetIndustry: document.getElementById('rIndustry').value.trim(),
        date: document.getElementById('rDate').value,
        tags: document.getElementById('rTags').value.trim().split('、').filter(Boolean),
        desc: document.getElementById('rDesc').value.trim(),
    };
    if (editingId) {
        const r = researches.find(x => x.id === editingId);
        if (r) Object.assign(r, data);
    } else {
        researches.unshift({ id: 'r'+Date.now(), ...data, applicant: '管理员', applicantInst: '平台管理', status: '待审核', followStatus: '未跟进', follower: '' });
    }
    closeModal('researchModal');
    editingId = null;
    render();
}

function openDeleteModal(id) { deletingId = id; showModal('deleteModal'); }
function confirmDelete() { researches = researches.filter(r => r.id !== deletingId); closeModal('deleteModal'); deletingId = null; render(); }

function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
function showModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }

render();
</script>
</body>
</html>
