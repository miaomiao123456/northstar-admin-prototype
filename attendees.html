<script>
// ============ 会议数据 ============

    ],
    c2: [
        { name: '孙浩然', company: '华泰证券', title: '金融科技主管', phone: '139****2233', email: 'shr@example.com', time: '2026-03-28 10:00', source: '平台注册', status: '已参会', remark: '' },
        { name: '钱佳', company: '平安资管', title: '量化研究员', phone: '136****5566', email: 'qj@example.com', time: '2026-03-29 14:00', source: '专家邀请', status: '已参会', remark: '' },

// 其他会议复用部分数据
['c4','c5','c6','c7','c8'].forEach(id => {

        attendeesData[id] = attendeesData.c1.slice(0, 3 + Math.floor(Math.random()*4)).map(a => ({...a, time: '2026-04-0'+(Math.floor(Math.random()*9)+1)+' 10:00', status: ['已报名','已参会','未参会','已取消'][Math.floor(Math.random()*4)]}));
    }
});

// ============ 导航 ============
const navLinkMap = {
    '/experts': 'experts-clone.html', '/conferences': 'conferences.html', '/attendees': 'attendees.html',
    '/minutes': 'minutes.html', '/collections': 'collections.html', '/topics': 'topics.html', '/stocks': 'stocks.html',
    '/research': 'research.html', '/users': 'user-management.html', '/source-monitor': 'source-monitor.html', '/user-profile': 'user-profile.html'
};

function renderNavItem(path, icon, label, isSub, isActive) {
    const href = navLinkMap[path] || path.replace('/', '') + '.html';
    if (isSub) {
        return `<a class="flex items-center h-10 mx-2 mb-0.5 rounded-lg text-sm transition-colors cursor-pointer whitespace-nowrap pl-8 pr-4 ${isActive ? 'bg-red-50 text-red-600 font-medium' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-800'}" href="${href}"><div class="w-3 h-3 flex items-center justify-center mr-1 flex-shrink-0"><i class="ri-corner-down-right-line text-xs text-gray-300"></i></div><div class="w-5 h-5 flex items-center justify-center flex-shrink-0"><i class="${icon} text-base"></i></div><span class="ml-2">${label}</span></a>`;
    }
    return `<a class="flex items-center h-10 mx-2 mb-0.5 rounded-lg text-sm transition-colors cursor-pointer whitespace-nowrap px-4 ${isActive ? 'bg-red-50 text-red-600 font-medium' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-800'}" href="${href}"><div class="w-5 h-5 flex items-center justify-center flex-shrink-0"><i class="${icon} text-base"></i></div><span class="ml-2">${label}</span></a>`;
}

function renderNav() {

        <nav class="flex-1 py-4 overflow-y-auto">
            ${renderNavItem('/experts','ri-user-star-line','专家管理',false,false)}
            ${renderNavItem('/conferences','ri-video-chat-line','专家会议管理',false,false)}
            ${renderNavItem('/attendees','ri-team-line','会议人员管理',true,true)}
            ${renderNavItem('/minutes','ri-file-text-line','专家纪要库',false,false)}
            ${renderNavItem('/collections','ri-bookmark-3-line','精选纪要集',true,false)}

            ${renderNavItem('/stocks','ri-stock-line','话题与股票清单',true,false)}
            ${renderNavItem('/research','ri-survey-line','调研活动管理',false,false)}
            ${renderNavItem('/users','ri-group-line','用户审核管理',false,false)}
            ${renderNavItem('/user-profile','ri-user-heart-line','用户画像管理',false,false)}
            ${renderNavItem('/source-monitor','ri-radar-line','信源监控需求管理',false,false)}
        </nav>
        <div class="border-t border-gray-100 p-3"><button class="w-full flex items-center justify-center h-9 rounded-lg text-gray-400 hover:bg-gray-50 hover:text-gray-600 transition-colors cursor-pointer"><div class="w-5 h-5 flex items-center justify-center"><i class="ri-arrow-left-s-line text-lg"></i></div></button></div>
    </aside>`;
}

// ============ 工具 ============
function getAttendees() { return attendeesData[selectedConference] || []; }

function getStats() {
    const all = getAttendees();
    const total = all.length;
    const registered = all.filter(a => a.status === '已报名').length;
    const attended = all.filter(a => a.status === '已参会').length;
    const notAttended = all.filter(a => a.status === '未参会').length;
    const rate = total > 0 ? Math.round((attended / total) * 100) : 0;
    return { total, registered, attended, notAttended, rate };
}

function getFiltered() {
    return getAttendees().filter(a => {
        const matchSearch = !searchQuery || a.name.includes(searchQuery) || a.company.includes(searchQuery);
        const matchFilter = activeFilter === '全部' || a.status === activeFilter;
        return matchSearch && matchFilter;
    });
}

function getStatusBadge(s) {
    const m = { '已报名': 'bg-blue-50 text-blue-500', '已参会': 'bg-green-50 text-green-600', '未参会': 'bg-orange-50 text-orange-500', '已取消': 'bg-gray-100 text-gray-500' };
    return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${m[s] || 'bg-gray-100 text-gray-500'}">${s}</span>`;
}

function getInitials(name) { return name.charAt(0); }

// ============ 渲染 ============
function render() {
    const stats = getStats();
    const filtered = getFiltered();
    const filters = ['全部','已报名','已参会','未参会','已取消'];

                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 flex items-center justify-center"><i class="ri-notification-3-line text-gray-400 text-lg"></i></div>
                    <div class="flex items-center gap-2 cursor-pointer"><div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center"><span class="text-xs font-medium text-red-600">管</span></div><span class="text-sm text-gray-600">管理员</span><div class="w-4 h-4 flex items-center justify-center"><i class="ri-arrow-down-s-line text-gray-400"></i></div></div>

                        ${conferenceList.map(c => `<option value="${c.id}" ${selectedConference===c.id?'selected':''}>${c.title}</option>`).join('')}
                    </select>
                </div>

                <!-- 看板 -->

                    <div class="bg-white rounded-xl p-4 flex flex-col items-center gap-1">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center text-red-500 bg-red-50"><i class="ri-team-line text-lg"></i></div>
                        <div class="text-2xl font-semibold text-gray-800">${stats.total}</div>
                        <div class="text-xs text-gray-400">报名总数</div>
                    </div>
                    <div class="bg-white rounded-xl p-4 flex flex-col items-center gap-1">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center text-blue-500 bg-blue-50"><i class="ri-user-add-line text-lg"></i></div>
                        <div class="text-2xl font-semibold text-gray-800">${stats.registered}</div>
                        <div class="text-xs text-gray-400">已报名</div>
                    </div>
                    <div class="bg-white rounded-xl p-4 flex flex-col items-center gap-1">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center text-green-500 bg-green-50"><i class="ri-user-follow-line text-lg"></i></div>
                        <div class="text-2xl font-semibold text-gray-800">${stats.attended}</div>
                        <div class="text-xs text-gray-400">已参会</div>
                    </div>
                    <div class="bg-white rounded-xl p-4 flex flex-col items-center gap-1">

                        <div class="text-xs text-gray-400">未参会</div>
                    </div>

                    </div>
                </div>

                <!-- 筛选 & 操作 -->
                <div class="bg-white rounded-xl">
                    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-50">

                            <div class="flex items-center gap-1 bg-gray-50 rounded-lg p-1">
                                ${filters.map(f => `<button class="filter-btn px-3 py-1 rounded-md text-sm transition-colors cursor-pointer whitespace-nowrap ${activeFilter===f?'active bg-white text-gray-800 font-medium':'text-gray-500 hover:text-gray-700'}" onclick="activeFilter='${f}';render()">${f}</button>`).join('')}
                            </div>
                            <div class="relative">
                                <div class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 flex items-center justify-center text-gray-400"><i class="ri-search-line text-sm"></i></div>
                                <input placeholder="搜索参会人..." class="pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg w-48 focus:outline-none focus:border-red-400" value="${searchQuery}" oninput="searchQuery=this.value;render()">
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="showModal('pushModal')" class="px-3 py-2 text-sm rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5 cursor-pointer"><i class="ri-send-plane-line"></i>推送会议纪要</button>
                            <button onclick="alert('导出成功')" class="px-3 py-2 text-sm rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors flex items-center gap-1.5 cursor-pointer"><i class="ri-download-line"></i>导出名单</button>
                        </div>
                    </div>

                    <!-- 表格 -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="text-left text-gray-400 border-b border-gray-50">
                                    <th class="px-5 py-3 font-medium">报名人信息</th>

                                        <button onclick="openDetailModal(${i})" class="text-red-500 hover:text-red-600 text-xs cursor-pointer">查看</button>

                        ${filtered.length === 0 ? '<div class="py-16 text-center text-gray-400"><i class="ri-inbox-line text-4xl mb-2 block"></i>暂无数据</div>' : ''}

}

function openDetailModal(idx) {
    const a = getFiltered()[idx];
    if (!a) return;
    document.getElementById('detailModalBody').innerHTML = `
        <div class="space-y-4">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-full bg-red-100 flex items-center justify-center"><span class="text-lg font-medium text-red-600">${getInitials(a.name)}</span></div>
                <div><div class="text-lg font-semibold text-gray-900">${a.name}</div><div class="text-sm text-gray-500">${a.company} · ${a.title}</div></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div><div class="text-xs text-gray-400 mb-1">电话</div><div class="text-gray-700">${a.phone}</div></div>
                <div><div class="text-xs text-gray-400 mb-1">邮箱</div><div class="text-gray-700">${a.email}</div></div>
                <div><div class="text-xs text-gray-400 mb-1">报名时间</div><div class="text-gray-700">${a.time}</div></div>
                <div><div class="text-xs text-gray-400 mb-1">来源渠道</div><div class="text-gray-700">${a.source}</div></div>
                <div><div class="text-xs text-gray-400 mb-1">参会状态</div>${getStatusBadge(a.status)}</div>
                <div><div class="text-xs text-gray-400 mb-1">备注</div><div class="text-gray-700">${a.remark || '无'}</div></div>
            </div>
        </div>`;
    showModal('detailModal');
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
function showModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }

render();
</script>
</body>
</html>
