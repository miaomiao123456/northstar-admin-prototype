<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北极星管理平台 - 话题与股票清单</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.5.0/remixicon.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        .filter-btn.active { background: white; color: #1f2937; font-weight: 500; }
        .modal-backdrop { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(2px); }
        .rise { color: #ef4444; } .fall { color: #22c55e; }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div id="app"></div>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between p-5 border-b border-gray-100">
                <h3 class="text-lg font-semibold text-gray-900">股票详情</h3>
                <button onclick="closeModal('detailModal')" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-400 hover:text-gray-600 transition-colors cursor-pointer"><i class="ri-close-line text-xl"></i></button>
            </div>
            <div id="detailModalBody" class="p-5"></div>
        </div>
    </div>

<script>
let stocks = [
    { code: '600276', name: '恒瑞医药', market: 'A股', industry: '医药', price: 42.35, change: 2.14, topics: ['创新药出海','PD-1竞争格局'], minutes: 3 },
    { code: '300750', name: '宁德时代', market: 'A股', industry: '动力电池', price: 218.60, change: -1.35, topics: ['新能源电池','储能'], minutes: 5 },
    { code: '002594', name: '比亚迪', market: 'A股', industry: '新能源汽车', price: 312.80, change: 3.21, topics: ['新能源汽车','海外扩张'], minutes: 4 },
    { code: '600519', name: '贵州茅台', market: 'A股', industry: '白酒', price: 1658.00, change: 0.85, topics: ['白酒消费','高端白酒'], minutes: 2 },
    { code: '601012', name: '隆基绿能', market: 'A股', industry: '光伏', price: 28.45, change: -2.67, topics: ['光伏组件','硅料'], minutes: 3 },
    { code: '600036', name: '招商银行', market: 'A股', industry: '证券', price: 35.20, change: 1.12, topics: ['银行理财','零售金融'], minutes: 1 },
    { code: '601318', name: '中国平安', market: 'A股', industry: '保险', price: 48.90, change: -0.42, topics: ['保险科技','综合金融'], minutes: 1 },
    { code: '09988', name: '阿里巴巴', market: '港股', industry: '互联网', price: 82.35, change: 4.56, topics: ['电商','云计算','AI'], minutes: 6 },
    { code: '00700', name: '腾讯控股', market: '港股', industry: '互联网', price: 388.40, change: 2.89, topics: ['游戏','社交','AI'], minutes: 5 },
    { code: '09888', name: '百度集团', market: '港股', industry: '互联网', price: 112.60, change: -1.78, topics: ['大模型','自动驾驶'], minutes: 4 },
    { code: 'AAPL', name: '苹果', market: '美股', industry: '消费电子', price: 195.82, change: 1.23, topics: ['iPhone','AI手机'], minutes: 2 },
    { code: 'NVDA', name: '英伟达', market: '美股', industry: 'GPU/AI芯片', price: 878.35, change: 5.67, topics: ['AI算力','GPU','数据中心'], minutes: 8 },
    { code: 'TSLA', name: '特斯拉', market: '美股', industry: '新能源汽车', price: 178.20, change: -3.15, topics: ['自动驾驶','FSD','机器人'], minutes: 3 },
    { code: '300760', name: '迈瑞医疗', market: 'A股', industry: '医疗器械', price: 298.50, change: 1.88, topics: ['医疗器械','海外市场'], minutes: 2 },
    { code: '688981', name: '中芯国际', market: 'A股', industry: '晶圆代工', price: 52.80, change: -0.95, topics: ['晶圆代工','国产替代'], minutes: 4 },
    { code: '300059', name: '东方财富', market: 'A股', industry: '互联网', price: 16.75, change: 3.42, topics: ['券商','互联网券商'], minutes: 1 },
];

let activeMarket = '全部市场';
let activeIndustry = '全部行业';
let searchQuery = '';

const markets = ['全部市场','A股','港股','美股'];
const industries = ['全部行业','医药','医疗器械','半导体','动力电池','新能源汽车','白酒','光伏','证券','保险','互联网','消费电子','GPU/AI芯片','晶圆代工','电商','电商/云计算','本地生活','CXO'];

const navLinkMap = {
    '/experts': 'experts-clone.html', '/conferences': 'conferences.html', '/attendees': 'attendees.html',
    '/minutes': 'minutes.html', '/collections': 'collections.html', '/topics': 'topics.html', '/stocks': 'stocks.html',
    '/research': 'research.html', '/users': 'user-management.html', '/source-monitor': 'source-monitor.html', '/user-profile': 'user-profile.html'
};

function renderNavItem(path, icon, label, isSub, isActive) {
    const href = navLinkMap[path] || path.replace('/', '') + '.html';
    if (isSub) {
        return `<a class="flex items-center h-10 mx-2 mb-0.5 rounded-lg text-sm transition-colors cursor-pointer whitespace-nowrap pl-8 pr-4 ${isActive ? 'bg-red-50 text-red-600 font-medium' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-800'}" href="${href}"><div class="w-3 h-3 flex items-center justify-center mr-1 flex-shrink-0"><i class="ri-corner-down-right-line text-xs text-gray-300"></i></div><div class="w-5 h-5 flex items-center justify-center flex-shrink-0"><i class="${icon} text-base"></i></div><span class="ml-2">${label}</span></a>`;
    }
    return `<a class="flex items-center h-10 mx-2 mb-0.5 rounded-lg text-sm transition-colors cursor-pointer whitespace-nowrap px-4 ${isActive ? 'bg-red-50 text-red-600 font-medium' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-800'}" href="${href}"><div class="w-5 h-5 flex items-center justify-center flex-shrink-0"><i class="${icon} text-base"></i></div><span class="ml-2">${label}</span></a>`;
}

function renderNav() {
    return `<aside class="flex flex-col bg-white border-r border-gray-100 transition-all duration-300 w-56">
        <div class="flex items-center h-16 px-4 border-b border-gray-100 cursor-pointer select-none"><img alt="财跃星辰" class="w-8 h-8 object-contain flex-shrink-0" src="https://static.readdy.ai/image/3dd3b08e3f41e718a9a692da40c4373e/36a1cddcc28d86e13fb969a9b2232329.png"><span class="ml-2 text-sm font-semibold text-gray-800 whitespace-nowrap">财跃星辰管理平台</span></div>
        <nav class="flex-1 py-4 overflow-y-auto">
            ${renderNavItem('/experts','ri-user-star-line','专家管理',false,false)}
            ${renderNavItem('/conferences','ri-video-chat-line','专家会议管理',false,false)}
            ${renderNavItem('/attendees','ri-team-line','会议人员管理',true,false)}
            ${renderNavItem('/minutes','ri-file-text-line','专家纪要库',false,false)}
            ${renderNavItem('/collections','ri-bookmark-3-line','精选纪要集',true,false)}
            ${renderNavItem('/topics','ri-pie-chart-line','话题与板块&产业链',true,false)}
            ${renderNavItem('/stocks','ri-stock-line','话题与股票清单',true,true)}
            ${renderNavItem('/research','ri-survey-line','调研活动管理',false,false)}
            ${renderNavItem('/users','ri-group-line','用户管理',false,false)}
            ${renderNavItem('/user-profile','ri-user-heart-line','用户画像管理',false,false)}
            ${renderNavItem('/source-monitor','ri-radar-line','信源监控需求管理',false,false)}
        </nav>
        <div class="border-t border-gray-100 p-3"><button class="w-full flex items-center justify-center h-9 rounded-lg text-gray-400 hover:bg-gray-50 hover:text-gray-600 transition-colors cursor-pointer"><div class="w-5 h-5 flex items-center justify-center"><i class="ri-arrow-left-s-line text-lg"></i></div></button></div>
    </aside>`;
}

function getStats() {
    return {
        aStocks: stocks.filter(s => s.market === 'A股').length,
        hkStocks: stocks.filter(s => s.market === '港股').length,
        usStocks: stocks.filter(s => s.market === '美股').length,
        topicCount: new Set(stocks.flatMap(s => s.topics)).size,
    };
}

function getFiltered() {
    return stocks.filter(s => {
        const matchSearch = !searchQuery || s.name.includes(searchQuery) || s.code.includes(searchQuery);
        const matchMarket = activeMarket === '全部市场' || s.market === activeMarket;
        const matchIndustry = activeIndustry === '全部行业' || s.industry === activeIndustry;
        return matchSearch && matchMarket && matchIndustry;
    });
}

function render() {
    const stats = getStats();
    const filtered = getFiltered();

    document.getElementById('app').innerHTML = `
    <div class="flex h-screen bg-gray-50 font-sans overflow-hidden">
        ${renderNav()}
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-white border-b border-gray-100 flex items-center justify-between px-6 flex-shrink-0">
                <h1 class="text-base font-semibold text-gray-800">话题与股票清单</h1>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 flex items-center justify-center"><i class="ri-notification-3-line text-gray-400 text-lg"></i></div>
                    <div class="flex items-center gap-2 cursor-pointer"><div class="w-8 h-8 rounded-full bg-red-100 flex items-center justify-center"><span class="text-xs font-medium text-red-600">管</span></div><span class="text-sm text-gray-600">管理员</span><div class="w-4 h-4 flex items-center justify-center"><i class="ri-arrow-down-s-line text-gray-400"></i></div></div>
                </div>
            </header>
            <main class="flex-1 overflow-y-auto p-6">
                <!-- 看板 -->
                <div class="grid grid-cols-4 gap-4 mb-6">
                    <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                        <div class="w-11 h-11 rounded-lg flex items-center justify-center text-red-500 bg-red-50"><i class="ri-stock-line text-xl"></i></div>
                        <div><div class="text-2xl font-semibold text-gray-800">${stats.aStocks}</div><div class="text-xs text-gray-400 mt-0.5">A股</div></div>
                    </div>
                    <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                        <div class="w-11 h-11 rounded-lg flex items-center justify-center text-blue-500 bg-blue-50"><i class="ri-stock-line text-xl"></i></div>
                        <div><div class="text-2xl font-semibold text-gray-800">${stats.hkStocks}</div><div class="text-xs text-gray-400 mt-0.5">港股</div></div>
                    </div>
                    <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                        <div class="w-11 h-11 rounded-lg flex items-center justify-center text-purple-500 bg-purple-50"><i class="ri-stock-line text-xl"></i></div>
                        <div><div class="text-2xl font-semibold text-gray-800">${stats.usStocks}</div><div class="text-xs text-gray-400 mt-0.5">美股</div></div>
                    </div>
                    <div class="bg-white rounded-xl p-5 flex items-center gap-4">
                        <div class="w-11 h-11 rounded-lg flex items-center justify-center text-green-500 bg-green-50"><i class="ri-hashtag text-xl"></i></div>
                        <div><div class="text-2xl font-semibold text-gray-800">${stats.topicCount}</div><div class="text-xs text-gray-400 mt-0.5">关联话题数</div></div>
                    </div>
                </div>

                <!-- 双筛选 & 搜索 -->
                <div class="bg-white rounded-xl">
                    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-50">
                        <div class="flex items-center gap-3">
                            <div class="flex items-center gap-1 bg-gray-50 rounded-lg p-1">
                                ${markets.map(m => `<button class="filter-btn px-3 py-1 rounded-md text-sm transition-colors cursor-pointer whitespace-nowrap ${activeMarket===m?'active bg-white text-gray-800 font-medium':'text-gray-500 hover:text-gray-700'}" onclick="activeMarket='${m}';render()">${m}</button>`).join('')}
                            </div>
                            <div class="flex items-center gap-1 bg-gray-50 rounded-lg p-1">
                                ${industries.slice(0,6).map(i => `<button class="filter-btn px-3 py-1 rounded-md text-xs transition-colors cursor-pointer whitespace-nowrap ${activeIndustry===i?'active bg-white text-gray-800 font-medium':'text-gray-500 hover:text-gray-700'}" onclick="activeIndustry='${i}';render()">${i}</button>`).join('')}
                                ${industries.length > 6 ? `<div class="relative group">
                                    <button class="filter-btn px-3 py-1 rounded-md text-xs transition-colors cursor-pointer whitespace-nowrap ${industries.slice(6).includes(activeIndustry)?'active bg-white text-gray-800 font-medium':'text-gray-500 hover:text-gray-700'}">更多 <i class="ri-arrow-down-s-line text-xs"></i></button>
                                    <div class="absolute top-full left-0 mt-1 bg-white shadow-lg rounded-lg border border-gray-100 py-1 hidden group-hover:block z-50 min-w-[140px]">
                                        ${industries.slice(6).map(i => `<button class="block w-full px-3 py-1.5 text-left text-xs hover:bg-gray-50 ${activeIndustry===i?'text-red-500 font-medium':'text-gray-600'}" onclick="activeIndustry='${i}';render()">${i}</button>`).join('')}
                                    </div>
                                </div>` : ''}
                            </div>
                            <div class="relative">
                                <div class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 flex items-center justify-center text-gray-400"><i class="ri-search-line text-sm"></i></div>
                                <input placeholder="搜索股票代码/名称..." class="pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg w-48 focus:outline-none focus:border-red-400" value="${searchQuery}" oninput="searchQuery=this.value;render()">
                            </div>
                        </div>
                    </div>

                    <!-- 表格 -->
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead>
                                <tr class="text-left text-gray-400 border-b border-gray-50">
                                    <th class="px-5 py-3 font-medium">股票代码</th>
                                    <th class="px-5 py-3 font-medium">股票名称</th>
                                    <th class="px-5 py-3 font-medium">市场</th>
                                    <th class="px-5 py-3 font-medium">所属行业</th>
                                    <th class="px-5 py-3 font-medium">最新价格</th>
                                    <th class="px-5 py-3 font-medium">涨跌幅</th>
                                    <th class="px-5 py-3 font-medium">关联话题</th>
                                    <th class="px-5 py-3 font-medium">关联纪要</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${filtered.map(s => `
                                <tr class="border-b border-gray-50 hover:bg-gray-50/50 transition-colors cursor-pointer" onclick="openDetailModal('${s.code}')">
                                    <td class="px-5 py-4 text-gray-500 font-mono text-xs">${s.code}</td>
                                    <td class="px-5 py-4">
                                        <span class="text-gray-800 font-medium">${s.name}</span>
                                    </td>
                                    <td class="px-5 py-4">
                                        <span class="px-2 py-0.5 rounded-md text-xs ${s.market==='A股'?'bg-red-50 text-red-500':s.market==='港股'?'bg-blue-50 text-blue-500':'bg-purple-50 text-purple-500'}">${s.market}</span>
                                    </td>
                                    <td class="px-5 py-4 text-gray-600 text-xs">${s.industry}</td>
                                    <td class="px-5 py-4 text-gray-800 font-medium">${s.price.toFixed(2)}</td>
                                    <td class="px-5 py-4">
                                        <span class="${s.change >= 0 ? 'rise' : 'fall'} font-medium">${s.change >= 0 ? '+' : ''}${s.change.toFixed(2)}%</span>
                                    </td>
                                    <td class="px-5 py-4">
                                        <div class="flex flex-wrap gap-1">
                                            ${s.topics.map(t => `<span class="px-1.5 py-0.5 rounded bg-gray-50 text-gray-500 text-xs">${t}</span>`).join('')}
                                        </div>
                                    </td>
                                    <td class="px-5 py-4">
                                        <span class="text-gray-600">${s.minutes} 篇</span>
                                    </td>
                                </tr>`).join('')}
                            </tbody>
                        </table>
                        ${filtered.length === 0 ? '<div class="py-16 text-center text-gray-400"><i class="ri-inbox-line text-4xl mb-2 block"></i>暂无数据</div>' : ''}
                    </div>
                    <div class="px-5 py-3 border-t border-gray-50 text-sm text-gray-400">共 ${filtered.length} 只股票</div>
                </div>
            </main>
        </div>
    </div>`;
}

function openDetailModal(code) {
    const s = stocks.find(x => x.code === code);
    if (!s) return;
    document.getElementById('detailModalBody').innerHTML = `
        <div class="space-y-4">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-xl bg-gray-100 flex items-center justify-center"><span class="text-sm font-bold text-gray-600">${s.code.slice(-3)}</span></div>
                <div>
                    <div class="text-lg font-semibold text-gray-900">${s.name}</div>
                    <div class="text-sm text-gray-400">${s.code} · ${s.market} · ${s.industry}</div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-gray-50 rounded-lg p-4 text-center">
                    <div class="text-2xl font-semibold ${s.change>=0?'rise':'fall'}">${s.price.toFixed(2)}</div>
                    <div class="text-xs text-gray-400 mt-1">最新价格</div>
                </div>
                <div class="bg-gray-50 rounded-lg p-4 text-center">
                    <div class="text-2xl font-semibold ${s.change>=0?'rise':'fall'}">${s.change>=0?'+':''}${s.change.toFixed(2)}%</div>
                    <div class="text-xs text-gray-400 mt-1">涨跌幅</div>
                </div>
            </div>
            <div><div class="text-xs text-gray-400 mb-1">关联话题 (${s.topics.length})</div><div class="flex flex-wrap gap-1">${s.topics.map(t=>`<span class="px-2 py-0.5 rounded-md bg-gray-50 text-gray-500 text-xs">${t}</span>`).join('')}</div></div>
            <div><div class="text-xs text-gray-400 mb-1">关联纪要</div><div class="text-gray-700">${s.minutes} 篇</div></div>
        </div>`;
    showModal('detailModal');
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
function showModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }

render();
</script>
</body>
</html>
