// ============ 工具函数 ============
function getStats() {
    const total = conferences.length;
    const live = conferences.filter(c => c.status === '直播中').length;
    const upcoming = conferences.filter(c => c.status === '即将开始').length;
    const regs = conferences.reduce((s, c) => s + c.registrations, 0);
    return { total, live, upcoming, regs };
}

function getFiltered() {
    return conferences.filter(c => {
        const matchSearch = !searchQuery || c.title.includes(searchQuery) || c.tags.some(t => t.includes(searchQuery)) || c.experts.some(e => e.name.includes(searchQuery));
        const matchFilter = activeFilter === '全部' || c.status === activeFilter;
        return matchSearch && matchFilter;
    });
}

function getStatusBadge(s) {
    const m = { '直播中': 'bg-red-50 text-red-500', '即将开始': 'bg-blue-50 text-blue-500', '已结束': 'bg-gray-100 text-gray-500' };
    return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${m[s] || 'bg-gray-100 text-gray-500'}">${s}</span>`;
}

function getFiltered() {
    return conferences.filter(c => {
        const matchSearch = !searchQuery || c.title.includes(searchQuery) || c.tags.some(t => t.includes(searchQuery)) || c.experts.some(e => e.name.includes(searchQuery));

    });
}

function openConferenceModal(id) {
    editingId = id || null;
    const c = id ? conferences.find(x => x.id === id) : null;
    // 预设专家
    selectedExpertId = c ? (expertList.find(e => e.name === c.experts[0]?.name)?.id || null) : null;
    selectedExpertName = c ? (c.experts[0]?.name || '') : '';
    coverData = c ? c.cover || null : null;
    document.getElementById('conferenceModalTitle').textContent = c ? '编辑会议' : '新增会议';
    document.getElementById('conferenceModalBody').innerHTML = `
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">会议标题</label>
                <input id="mTitle" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400" value="${c?c.title:''}" placeholder="输入会议标题">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">主讲专家</label>
                <div class="relative" id="expertDropdownWrap">
                    <div id="expertSelector" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm cursor-pointer bg-white flex items-center justify-between hover:border-red-300 transition-colors" onclick="toggleExpertDropdown()">
                        <span id="expertSelectedText" class="${selectedExpertName ? 'text-gray-800' : 'text-gray-400'}">${selectedExpertName || '点击选择主讲专家'}</span>
                        <i class="ri-arrow-down-s-line text-gray-400 ml-2 transition-transform" id="expertDropdownArrow"></i>
                    </div>
                    <div id="expertDropdown" class="absolute left-0 right-0 top-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-10 hidden max-h-60 overflow-hidden flex flex-col">
                        <div class="p-2 border-b border-gray-100 sticky top-0 bg-white">
                            <input id="expertSearch" type="text" class="w-full px-3 py-1.5 border border-gray-200 rounded-md text-sm focus:outline-none focus:border-red-300" placeholder="搜索专家姓名..." oninput="filterExpertList()" onclick="event.stopPropagation()">
                        </div>
                        <div id="expertOptions" class="overflow-y-auto"></div>
                    </div>
                </div>
                <input type="hidden" id="mExpert" value="${c?c.experts[0]?c.experts[0].name:selectedExpertName:selectedExpertName}">
                <input type="hidden" id="mExpertInst" value="${c?c.experts[0]?c.experts[0].inst:'':selectedExpertName ? (expertList.find(e=>e.name===selectedExpertName)||{}).institution||'':''}">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">话题标签</label>
                <input id="mTags" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400" value="${c?c.tags.join('、'):''}" placeholder="输入标签，多个用顿号分隔">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">开始时间</label>
                    <input id="mTime" type="datetime-local" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400" value="${c?c.time.replace(' ','T'):''}">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                    <select id="mStatus" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400">
                        <option value="即将开始" ${c&&c.status==='即将开始'?'selected':''}>即将开始</option>
                        <option value="直播中" ${c&&c.status==='直播中'?'selected':''}>直播中</option>
                        <option value="已结束" ${c&&c.status==='已结束'?'selected':''}>已结束</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">会议权限</label>
                <div class="flex gap-3">
                    <label class="flex-1 flex items-center justify-center h-10 rounded-lg border-2 cursor-pointer transition-colors hover:border-red-300 ${c&&c.permission&&c.permission.includes('买方')?'border-red-400 bg-red-50 text-red-600':'border-gray-200 text-gray-500'}" onclick="togglePerm('买方',this)">
                        <input type="checkbox" name="mPermission" value="买方" class="hidden" ${c&&c.permission&&c.permission.includes('买方')?'checked':''}>买方
                    </label>
                    <label class="flex-1 flex items-center justify-center h-10 rounded-lg border-2 cursor-pointer transition-colors hover:border-red-300 ${c&&c.permission&&c.permission.includes('卖方')?'border-red-400 bg-red-50 text-red-600':'border-gray-200 text-gray-500'}" onclick="togglePerm('卖方',this)">
                        <input type="checkbox" name="mPermission" value="卖方" class="hidden" ${c&&c.permission&&c.permission.includes('卖方')?'checked':''}>卖方
                    </label>
                    <label class="flex-1 flex items-center justify-center h-10 rounded-lg border-2 cursor-pointer transition-colors hover:border-red-300 ${c&&c.permission&&c.permission.includes('订阅会员')?'border-red-400 bg-red-50 text-red-600':'border-gray-200 text-gray-500'}" onclick="togglePerm('订阅会员',this)">
                        <input type="checkbox" name="mPermission" value="订阅会员" class="hidden" ${c&&c.permission&&c.permission.includes('订阅会员')?'checked':''}>订阅会员
                    </label>
                </div>
            </div>
            <!-- 封面上传 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">会议封面</label>
                <div id="coverUploadArea" class="relative border-2 border-dashed border-gray-200 rounded-xl p-4 text-center hover:border-red-300 hover:bg-red-50/30 transition-colors cursor-pointer" onclick="document.getElementById('coverFileInput').click()">
                    <div id="coverUploadPlaceholder" class="${c&&c.cover?'hidden':''}">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-2"><i class="ri-image-add-line text-gray-400 text-lg"></i></div>
                        <p class="text-sm text-gray-500">点击上传会议封面</p>
                        <p class="text-xs text-gray-400 mt-1">支持 JPG、PNG 格式，上限 5MB</p>
                    </div>
                    <div id="coverUploadPreview" class="${c&&c.cover?'':'hidden'}">
                        ${c&&c.cover ? `<img src="${c.cover}" class="max-h-36 mx-auto rounded-lg shadow-sm" alt="封面预览">` : '<img id="coverPreviewImg" class="max-h-36 mx-auto rounded-lg shadow-sm hidden" alt="封面预览">'}
                        <p class="text-xs text-gray-400 mt-2">点击重新上传</p>
                    </div>
                </div>
                <input type="file" id="coverFileInput" class="hidden" accept="image/jpeg,image/png" onchange="handleCoverUpload(this)">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">会议简介</label>
                <textarea id="mDesc" rows="3" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-red-400 resize-none" placeholder="输入会议简介">${c?c.desc:''}</textarea>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="closeConferenceModal()" class="flex-1 h-10 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors text-sm cursor-pointer">取消</button>
                <button onclick="saveConference()" class="flex-1 h-10 rounded-lg bg-red-500 text-white hover:bg-red-600 transition-colors text-sm cursor-pointer">保存</button>
            </div>
        </div>`;
    showModal('conferenceModal');
}

function saveConference() {
    const title = document.getElementById('mTitle').value.trim();
    const expertName = document.getElementById('mExpert').value.trim();
    const expertInst = document.getElementById('mExpertInst').value.trim();
    const tags = document.getElementById('mTags').value.trim();
    const time = document.getElementById('mTime').value.replace('T',' ');
    const status = document.getElementById('mStatus').value;
    const desc = document.getElementById('mDesc').value.trim();
    const permCbs = document.querySelectorAll('input[name="mPermission"]:checked');
    const permission = Array.from(permCbs).map(cb => cb.value);
    if (!title) { alert('请输入会议标题'); return; }
    if (!expertName) { alert('请选择主讲专家'); return; }

    if (editingId) {
        const c = conferences.find(x => x.id === editingId);
        if (c) { c.title = title; c.experts = [{name:expertName, inst:expertInst}]; c.tags = tags ? tags.split('、') : []; c.time = time; c.status = status; c.desc = desc; c.permission = permission; c.cover = coverData || c.cover; }
    } else {
        conferences.unshift({ id: 'c'+Date.now(), title, experts: [{name:expertName, inst:expertInst}], tags: tags ? tags.split('、') : [], time, status, registrations: 0, desc, permission, cover: coverData, materials: [] });
    }
    closeConferenceModal();
    render();
}

function openDeleteModal(id) {
    deletingId = id;
    showModal('deleteModal');
}

function confirmDelete() {
    conferences = conferences.filter(c => c.id !== deletingId);
    closeDeleteModal();
    render();
}

function openDetailModal(id) {
    const c = conferences.find(x => x.id === id);
    if (!c) return;
    document.getElementById('detailModalBody').innerHTML = `
        <div class="space-y-4">
            <div>
                <div class="text-xs text-gray-400 mb-1">会议标题</div>
                <div class="text-gray-800 font-medium">${c.title}</div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <div class="text-xs text-gray-400 mb-1">主讲专家</div>
                    <div class="text-gray-600">${c.experts.map(e=>e.name+' ('+e.inst+')').join('、') || '暂无'}</div>
                </div>
                <div>
                    <div class="text-xs text-gray-400 mb-1">状态</div>
                    ${getStatusBadge(c.status)}
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <div class="text-xs text-gray-400 mb-1">开始时间</div>
                    <div class="text-gray-600">${c.time}</div>
                </div>
                <div>
                    <div class="text-xs text-gray-400 mb-1">报名人数</div>
                    <div class="text-gray-600">${c.registrations} 人</div>
                </div>
            </div>
            <div>
                <div class="text-xs text-gray-400 mb-1">会议权限</div>
                <div class="flex gap-1.5">${(c.permission||[]).map(p => `<span class="px-2 py-0.5 rounded text-xs bg-red-50 text-red-600">${p}</span>`).join('') || '<span class="text-gray-400 text-sm">-</span>'}</div>
            </div>
            <div>
                <div class="text-xs text-gray-400 mb-1">话题标签</div>
                <div class="flex flex-wrap gap-1">${c.tags.map(t=>`<span class="px-2 py-0.5 rounded-md bg-gray-50 text-gray-500 text-xs">${t}</span>`).join('')}</div>
            </div>
            <div>
                <div class="text-xs text-gray-400 mb-1">会议简介</div>
                <div class="text-gray-600 text-sm">${c.desc}</div>
            </div>
            <div>
                <div class="text-xs text-gray-400 mb-1">会议链接</div>
                <div class="text-gray-600 text-sm">${c.link ? `<a href="${c.link}" target="_blank" class="text-blue-500 hover:text-blue-600 underline break-all">${c.link}</a>` : '<span class="text-gray-400">暂无链接</span>'}</div>
            </div>
            <div>
                <div class="text-xs text-gray-400 mb-1">链接资料</div>
                <div class="space-y-1">${c.materials.map(m=>`<div class="flex items-center gap-2 text-sm text-gray-600"><i class="ri-file-text-line text-gray-400"></i>${m}</div>`).join('') || '<span class="text-gray-400 text-sm">暂无资料</span>'}</div>
            </div>
        </div>`;
    showModal('detailModal');
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }
function showModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
function closeConferenceModal() { closeModal('conferenceModal'); editingId = null; selectedExpertId = null; selectedExpertName = ''; coverData = null; }

// ============ 专家下拉选择 ============
function toggleExpertDropdown() {
    const dropdown = document.getElementById('expertDropdown');
    const arrow = document.getElementById('expertDropdownArrow');
    if (dropdown.classList.contains('hidden')) {
        dropdown.classList.remove('hidden');
        arrow.classList.add('rotate-180');
        filterExpertList();
        setTimeout(() => document.addEventListener('click', closeExpertDropdownHandle), 0);
    } else {
        closeExpertDropdown();
    }
}

function closeExpertDropdownHandle(e) {
    const wrap = document.getElementById('expertDropdownWrap');
    if (!wrap.contains(e.target)) { closeExpertDropdown(); document.removeEventListener('click', closeExpertDropdownHandle); }
}

function closeExpertDropdown() {
    const dropdown = document.getElementById('expertDropdown');
    const arrow = document.getElementById('expertDropdownArrow');
    dropdown.classList.add('hidden');
    arrow.classList.remove('rotate-180');
}

function filterExpertList() {
    const query = document.getElementById('expertSearch').value.toLowerCase().trim();
    const container = document.getElementById('expertOptions');
    const filtered = expertList.filter(e => !query || e.name.toLowerCase().includes(query) || e.institution.toLowerCase().includes(query));
    if (filtered.length === 0) {
        container.innerHTML = '<div class="px-4 py-3 text-sm text-gray-400 text-center">无匹配专家</div>';
    } else {
        container.innerHTML = filtered.map(e => `
            <div class="px-4 py-2.5 text-sm hover:bg-red-50 cursor-pointer border-b border-gray-50 flex items-center justify-between ${selectedExpertId === e.id ? 'bg-red-50 text-red-600 font-medium' : 'text-gray-700'}"
                onclick="selectExpert('${e.id}','${e.name}','${e.institution}')">
                <div><span>${e.name}</span><span class="text-xs text-gray-400 ml-2">${e.institution}</span></div>
                ${selectedExpertId === e.id ? '<i class="ri-check-line text-red-500"></i>' : ''}
            </div>`).join('');
    }
}

function selectExpert(id, name, institution) {
    selectedExpertId = id; selectedExpertName = name;
    document.getElementById('expertSelectedText').textContent = name + ' · ' + institution;
    document.getElementById('expertSelectedText').classList.remove('text-gray-400');
    document.getElementById('expertSelectedText').classList.add('text-gray-800');
    document.getElementById('mExpert').value = name;
    document.getElementById('mExpertInst').value = institution;
    closeExpertDropdown();
}

// ============ 会议权限多选 ============
function togglePerm(value, label) {
    const cb = label.querySelector('input[name="mPermission"]');
    cb.checked = !cb.checked;
    if (cb.checked) { label.classList.add('border-red-400','bg-red-50','text-red-600'); label.classList.remove('border-gray-200','text-gray-500'); }
    else { label.classList.remove('border-red-400','bg-red-50','text-red-600'); label.classList.add('border-gray-200','text-gray-500'); }
}

// ============ 封面上传 ============
let coverData = null;
function handleCoverUpload(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('文件大小不能超过 5MB'); input.value = ''; return; }
    const reader = new FileReader();
    reader.onload = function(e) {
        coverData = e.target.result;
        document.getElementById('coverUploadPlaceholder').classList.add('hidden');
        document.getElementById('coverUploadPreview').classList.remove('hidden');
        const preview = document.getElementById('coverUploadPreview');
        const img = preview.querySelector('img');
        if (img) { img.src = coverData; img.classList.remove('hidden'); }
        else { preview.innerHTML = '<img src="'+coverData+'" class="max-h-36 mx-auto rounded-lg shadow-sm" alt="封面预览"><p class="text-xs text-gray-400 mt-2">点击重新上传</p>'; }
    };
    reader.readAsDataURL(file);
}

function closeDeleteModal() { closeModal('deleteModal'); deletingId = null; }
function closeDetailModal() { closeModal('detailModal'); }

// ============ 初始化 ============
render();
</script>
</body>
</html>
